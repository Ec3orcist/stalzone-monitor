<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Auction Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2f; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #61dafb; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2b2b3c; color: white; font-size: 16px; }
        input { min-width: 280px; }
        button { cursor: pointer; background: #61dafb; color: #1e1e2f; font-weight: bold; border: none; }
        button:hover { background: #4fa8c7; }
        .card { background: #2b2b3c; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stats { display: flex; justify-content: space-around; text-align: center; margin-top: 10px; flex-wrap: wrap; gap: 15px; }
        .stat-item { flex: 1; min-width: 150px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #61dafb; }
        .stat-label { font-size: 13px; color: #aaa; margin-top: 4px; }
        .stat-sub { font-size: 12px; color: #888; margin-top: 2px; }
        canvas { max-height: 400px; }
        .green { color: #4caf50 !important; }
        .red { color: #f44336 !important; }
        .loading { text-align: center; color: #aaa; padding: 20px; }
        .item-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .item-icon { width: 72px; height: 72px; border-radius: 8px; background: #1e1e2f; object-fit: contain; }
        .item-icon-placeholder { width: 72px; height: 72px; border-radius: 8px; background: #3a3a4f; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #61dafb; }
        .item-title { font-size: 22px; font-weight: bold; color: #61dafb; }
        .item-id { font-size: 14px; color: #888; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #3a3a4f; }
        th { color: #61dafb; font-weight: bold; font-size: 14px; }
        td { font-size: 15px; }
        tr:hover { background: #32324a; }
        .price-cell { color: #61dafb; font-weight: bold; }
        .time-cell { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stalzone Auction Monitor</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Поиск по названию или ID...">
            <select id="itemSelect"><option value="">Загрузка...</option></select>
            <button onclick="loadData()">Обновить</button>
        </div>

        <div class="card" id="statsCard" style="display:none;">
            <div class="item-header">
                <img id="itemIcon" class="item-icon" src="" alt="icon" onerror="showIconPlaceholder()">
                <div id="iconPlaceholder" class="item-icon-placeholder" style="display:none;"></div>
                <div>
                    <div class="item-title" id="itemName">Предмет</div>
                    <div class="item-id" id="itemIdDisplay"></div>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="currentPrice">-</div>
                    <div class="stat-label">Цена за 1 шт</div>
                    <div class="stat-sub" id="bestLotInfo"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgPrice">-</div>
                    <div class="stat-label">Средняя (7 дней)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="deviation">-</div>
                    <div class="stat-label">Отклонение от средней</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalAmount">-</div>
                    <div class="stat-label">Всего на аукционе</div>
                    <div class="stat-sub" id="lotsCountInfo"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="pointsCount">-</div>
                    <div class="stat-label">Точек истории</div>
                </div>
            </div>
        </div>

        <div class="card"><canvas id="priceChart"></canvas></div>

        <div class="card" id="lotsCard" style="display:none;">
            <h2 style="color:#61dafb; margin-top:0;">📋 Актуальные лоты</h2>
            <table id="lotsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Цена за 1 шт</th>
                        <th>Количество</th>
                        <th>Цена лота</th>
                        <th>Истекает</th>
                    </tr>
                </thead>
                <tbody id="lotsTableBody"></tbody>
            </table>
        </div>

        <div class="loading" id="loadingMsg" style="display:none;">Загрузка данных...</div>
    </div>

    <script>
        let allData = {}, chartInstance = null;

        async function loadData() {
            const msg = document.getElementById('loadingMsg');
            msg.style.display = 'block';
            msg.textContent = 'Загрузка данных...';
            try {
                const resp = await fetch('prices.json?t=' + Date.now());
                allData = await resp.json();
                populateSelect();
                msg.style.display = 'none';
            } catch (e) {
                console.error(e);
                msg.textContent = '❌ Не удалось загрузить prices.json';
            }
        }

        function getItemMeta(id) {
            const hist = allData[id];
            if (hist && hist.length) {
                const last = hist[hist.length - 1];
                return { name: last.name || id, icon: last.icon || '' };
            }
            return { name: id, icon: '' };
        }

        function showIconPlaceholder() {
            const img = document.getElementById('itemIcon');
            const placeholder = document.getElementById('iconPlaceholder');
            img.style.display = 'none';
            placeholder.style.display = 'flex';
            placeholder.textContent = (document.getElementById('itemName').textContent || '?')[0].toUpperCase();
        }

        function populateSelect(filter = '') {
            const sel = document.getElementById('itemSelect');
            const current = sel.value;
            sel.innerHTML = '<option value="">Выберите предмет...</option>';

            const f = filter.toLowerCase();
            const items = Object.keys(allData).filter(id => {
                if (!f) return true;
                const meta = getItemMeta(id);
                return id.toLowerCase().includes(f) || meta.name.toLowerCase().includes(f);
            }).sort((a, b) => getItemMeta(a).name.localeCompare(getItemMeta(b).name));

            items.forEach(id => {
                const meta = getItemMeta(id);
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = meta.name;
                sel.appendChild(opt);
            });

            if (items.length && !current) {
                sel.value = items[0];
                renderChart();
            } else if (current) {
                sel.value = current;
            }
        }

        function renderLots(lots) {
            const card = document.getElementById('lotsCard');
            const tbody = document.getElementById('lotsTableBody');
            tbody.innerHTML = '';

            if (!lots || !lots.length) {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';

            lots.forEach((lot, i) => {
                const tr = document.createElement('tr');
                const endTime = lot.endTime ? new Date(lot.endTime).toLocaleString('ru-RU') : '—';
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td class="price-cell">${lot.price_per_unit.toLocaleString()} ₽</td>
                    <td>${lot.amount.toLocaleString()} шт</td>
                    <td>${lot.buyout.toLocaleString()} ₽</td>
                    <td class="time-cell">${endTime}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart() {
            const id = document.getElementById('itemSelect').value;
            if (!id || !allData[id] || !allData[id].length) {
                document.getElementById('statsCard').style.display = 'none';
                document.getElementById('lotsCard').style.display = 'none';
                return;
            }
            const hist = allData[id];
            const meta = getItemMeta(id);
            const labels = hist.map(h => new Date(h.timestamp).toLocaleString());
            const prices = hist.map(h => h.price);

            const last = hist[hist.length - 1];
            const cur = prices[prices.length - 1];
            const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
            const dev = avg > 0 ? ((cur - avg) / avg) * 100 : 0;

            document.getElementById('statsCard').style.display = 'block';
            document.getElementById('itemName').textContent = meta.name;
            document.getElementById('itemIdDisplay').textContent = `ID: ${id}`;

            // Иконка (с fallback)
            const img = document.getElementById('itemIcon');
            const placeholder = document.getElementById('iconPlaceholder');
            if (meta.icon) {
                img.style.display = 'block';
                img.src = meta.icon;
                placeholder.style.display = 'none';
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
                placeholder.textContent = (meta.name || '?')[0].toUpperCase();
            }

            document.getElementById('currentPrice').textContent = cur.toLocaleString() + ' ₽';

            const bestInfo = document.getElementById('bestLotInfo');
            if (last.best_lot_amount && last.best_lot_buyout) {
                bestInfo.textContent = `Лучший лот: ${last.best_lot_amount} шт за ${last.best_lot_buyout.toLocaleString()} ₽`;
            } else {
                bestInfo.textContent = '';
            }

            document.getElementById('avgPrice').textContent = Math.round(avg).toLocaleString() + ' ₽';

            const devEl = document.getElementById('deviation');
            devEl.textContent = (dev > 0 ? '+' : '') + dev.toFixed(1) + '%';
            devEl.className = 'stat-value ' + (dev > 0 ? 'red' : 'green');

            const totalEl = document.getElementById('totalAmount');
            totalEl.textContent = (last.total_amount !== undefined)
                ? last.total_amount.toLocaleString() + ' шт'
                : '—';

            const lotsInfo = document.getElementById('lotsCountInfo');
            lotsInfo.textContent = (last.lots_count !== undefined) ? `${last.lots_count} лотов` : '';

            document.getElementById('pointsCount').textContent = prices.length;

            // Рисуем таблицу лотов
            renderLots(last.lots || []);

            // График
            const ctx = document.getElementById('priceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Цена за 1 шт', data: prices, borderColor: '#61dafb', backgroundColor: 'rgba(97,218,251,0.1)', borderWidth: 2, pointRadius: 3, fill: true, tension: 0.1 },
                        { label: 'Средняя', data: new Array(prices.length).fill(avg), borderColor: '#f44336', borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e0e0e0' } } },
                    scales: {
                        x: { ticks: { color: '#aaa' }, grid: { color: '#444' } },
                        y: { ticks: { color: '#aaa' }, grid: { color: '#444' } }
                    }
                }
            });
        }

        document.getElementById('itemSelect').addEventListener('change', renderChart);
        document.getElementById('searchInput').addEventListener('input', e => populateSelect(e.target.value));
        loadData();
    </script>
</body>
</html>
