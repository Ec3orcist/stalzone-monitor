<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Auction Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #07060b;
            --bg-2: #100d18;
            --panel: #161221;
            --panel-2: #221b30;
            --line: #3a2d52;
            --text: #f3eefb;
            --muted: #a394bc;
            --accent: #c4b5fd;
            --accent-2: #86efac;
            --danger: #fb7185;
            --warn: #f0c36a;
        }
        * { box-sizing: border-box; }
        ::selection { background: #6d28d9; color: #fff; }
        body { font-family: "Segoe UI", "Trebuchet MS", sans-serif; background:
            radial-gradient(900px 420px at 50% -8%, #2a1848 0%, var(--bg) 58%);
            color: var(--text); margin: 0; padding: 16px 20px 40px; min-height: 100vh; }
        h1 { color: var(--text); text-align: left; margin: 0; font-weight: 700; letter-spacing: .02em; font-size: 22px; }
        .subtitle { text-align: left; color: var(--muted); margin: 2px 0 0; font-size: 12px; }
        .container { max-width: 1280px; margin: 0 auto; }
        .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0 14px; background: linear-gradient(180deg, rgba(7,6,11,.96), rgba(7,6,11,.88) 70%, rgba(7,6,11,0)); }
        .tabs { display: flex; gap: 8px; }
        .tab { padding: 9px 18px; background: rgba(22, 18, 33, .8); border: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer; border-radius: 999px; transition: .15s; }
        .tab:hover { color: var(--text); border-color: #7c5cbf; }
        .tab.active { color: #f8f4ff; background: linear-gradient(180deg, #6d4ad4, #4c2f96); border-color: #8b6cf0; font-weight: 650; box-shadow: 0 6px 18px rgba(76, 47, 150, .45); }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; padding: 10px; background: rgba(22,18,33,.72); border: 1px solid var(--line); border-radius: 14px; }
        .controls input { flex: 1 1 220px; }
        input, select, button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #120e1b; color: var(--text); font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #8b6cf0; }
        input { min-width: 0; }
        button { cursor: pointer; }
        #refreshBtn { background: linear-gradient(180deg, #7c5cbf, #5b3d9a); color: #f8f4ff; font-weight: 700; border: none; }
        #refreshBtn:hover { filter: brightness(1.1); }
        .stats-bar { text-align: left; color: var(--muted); font-size: 13px; margin: 0 4px 12px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
        .item-card { background: var(--panel); border-radius: 14px; padding: 12px 40px 12px 12px; cursor: pointer; position: relative; transition: .15s; text-align: left; display: flex; flex-direction: row; align-items: center; gap: 12px; border: 1px solid var(--line); }
        .item-card:hover { border-color: #8b6cf0; background: #1c1729; }
        .card-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .card-star { position: absolute; top: 8px; right: 6px; z-index: 2; background: transparent; border: none; color: #5c516e; font-size: 20px; cursor: pointer; padding: 2px 7px; line-height: 1; border-radius: 4px; }
        .card-star:hover { color: var(--muted); }
        .card-star.active { color: var(--accent); }
        .card-icon { width: 52px; height: 52px; object-fit: contain; border-radius: 8px; background: var(--bg); pointer-events: none; -webkit-user-drag: none; user-select: none; flex-shrink: 0; }
        .card-icon-empty { width: 52px; height: 52px; background: var(--bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 20px; pointer-events: none; flex-shrink: 0; }
        .card-name { font-size: 14px; color: var(--text); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { font-size: 16px; font-weight: 700; color: var(--accent); }
        .card-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
        .card-dev { font-weight: 700; }
        .card-dev.green { color: var(--accent-2); }
        .card-dev.red { color: var(--danger); }
        .card-dev.neutral { color: var(--muted); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 16px; grid-column: 1 / -1; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 3, 10, 0.84); display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; z-index: 100; overflow-y: auto; }
        .modal { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; max-width: 1100px; width: 100%; padding: 25px; position: relative; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
        .modal-close { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--muted); font-size: 28px; cursor: pointer; padding: 0 8px; line-height: 1; }
        .modal-close:hover { color: var(--text); }
        .item-header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; padding-right: 40px; }
        .item-icon { width: 96px; height: 96px; border-radius: 10px; background: var(--panel); object-fit: contain; flex-shrink: 0; pointer-events: none; -webkit-user-drag: none; }
        .item-icon-empty { width: 96px; height: 96px; border-radius: 10px; background: var(--panel); display: flex; align-items: center; justify-content: center; color: #555; font-size: 36px; flex-shrink: 0; }
        .item-title { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
        .item-id { font-size: 13px; color: var(--muted); }
        .category-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--panel-2); font-size: 12px; color: var(--accent); margin-left: 10px; vertical-align: middle; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-item { background: var(--panel); padding: 14px; border-radius: 10px; text-align: center; border: 1px solid var(--line); }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .stat-sub { font-size: 11px; color: #8b7da3; margin-top: 3px; }
        .green { color: var(--accent-2) !important; }
        .red { color: var(--danger) !important; }
        .chart-container { background: var(--panel); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line); }
        th { color: var(--accent); font-weight: 700; font-size: 13px; }
        td { font-size: 14px; }
        tr:hover { background: var(--panel-2); }
        .price-cell { color: var(--accent); font-weight: 700; }
        .time-cell { color: var(--muted); font-size: 13px; }
        .lots-title { color: var(--accent); margin-top: 0; margin-bottom: 10px; }
        canvas { max-height: 350px; }

        .craft-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .craft-list-item { background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: .15s; border: 1px solid var(--line); }
        .craft-list-item:hover { border-color: #8b6cf0; background: #1c1729; }
        .craft-list-icon { width: 44px; height: 44px; object-fit: contain; border-radius: 4px; background: var(--bg); flex-shrink: 0; pointer-events: none; -webkit-user-drag: none; }
        .craft-list-info { flex: 1; min-width: 0; }
        .craft-list-name { font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .craft-list-profit { font-weight: 700; text-align: right; flex-shrink: 0; min-width: 108px; padding: 6px 10px; border-radius: 10px; background: #120e1b; }
        .craft-list-profit.green { color: var(--accent-2); }
        .craft-list-profit.red { color: var(--danger); }
        .craft-list-stations { font-size: 11px; color: #8b7da3; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
        .craft-prices { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 3px; }
        .craft-prices b { color: var(--text); font-weight: 650; }
        .craft-prices .buy b { color: var(--accent); }
        .station-mini { background: var(--bg); padding: 1px 6px; border-radius: 3px; color: var(--muted); }

        .skill-header { background: linear-gradient(90deg, var(--panel), var(--panel-2)); padding: 15px; border-radius: 10px; margin-bottom: 12px; margin-top: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--line); }
        .skill-header:first-child { margin-top: 0; }
        .skill-header-icon { width: 48px; height: 48px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .skill-header-info { flex: 1; }
        .skill-header-name { font-size: 18px; font-weight: 700; color: var(--accent); }
        .skill-header-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
        .subcat-header { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 0; padding-left: 8px; border-left: 3px solid var(--accent); }

        .skill-level-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #221b30; border: 1px solid #4c3d68; color: #ddd4ee; font-weight: bold; }
        .skill-level-badge.lvl-1 { border-color: #86efac; color: #86efac; }
        .skill-level-badge.lvl-2 { border-color: #a7f3d0; color: #a7f3d0; }
        .skill-level-badge.lvl-3 { border-color: #f0c36a; color: #f0c36a; }
        .skill-level-badge.lvl-4 { border-color: #fb923c; color: #fb923c; }
        .skill-level-badge.lvl-5 { border-color: #fb7185; color: #fb7185; }

        .craft-node { background: var(--panel); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #4c3d68; }
        .craft-node.profitable { border-left-color: var(--accent-2); }
        .craft-node.unprofitable { border-left-color: var(--danger); }
        .craft-node-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .craft-node-icon { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; background: var(--bg); pointer-events: none; -webkit-user-drag: none; }
        .craft-node-name { font-size: 16px; font-weight: bold; color: var(--accent); }
        .craft-node-id { font-size: 12px; color: var(--muted); }
        .craft-ingredients { margin-left: 20px; margin-top: 10px; padding-left: 15px; border-left: 2px dashed var(--line); }
        .craft-ingredient { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
        .craft-ingredient-icon { width: 28px; height: 28px; object-fit: contain; border-radius: 3px; background: var(--bg); pointer-events: none; -webkit-user-drag: none; }
        .craft-ingredient-name { color: var(--text); }
        .craft-ingredient-amount { color: var(--muted); font-size: 12px; }
        .craft-ingredient-cost { color: var(--accent); margin-left: auto; font-weight: bold; }

        details.craft-sub { margin: 4px 0; border-left: 3px solid #8b6cf0; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
        details.craft-sub > summary { cursor: pointer; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        details.craft-sub > summary::-webkit-details-marker { display: none; }
        details.craft-sub > summary::before { content: "+"; display: inline-block; width: 20px; font-weight: bold; color: var(--accent); text-align: center; }
        details.craft-sub[open] > summary::before { content: "−"; }
        details.craft-sub > summary:hover { background: #2c2340; }
        details.craft-sub .craft-sub-body { padding: 8px 12px 12px 24px; border-top: 1px solid var(--line); }

        .shopping-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--panel); border-radius: 10px; overflow: hidden; }
        .shopping-table th { background: var(--panel-2); padding: 12px; text-align: left; font-size: 13px; color: var(--accent); }
        .shopping-table td { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 14px; }
        .shopping-icon { width: 32px; height: 32px; vertical-align: middle; margin-right: 10px; border-radius: 4px; background: var(--bg); object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
        .no-price { color: var(--muted); font-style: italic; }
        .craft-summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .craft-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .craft-summary-item { text-align: center; }
        .craft-summary-value { font-size: 22px; font-weight: bold; color: var(--accent); }
        .craft-summary-value.green { color: var(--accent-2); }
        .craft-summary-value.red { color: var(--danger); }
        .craft-summary-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .qty-input { width: 120px; padding: 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 16px; text-align: center; }
        .qty-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; padding: 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
        .qty-row label { color: var(--muted); font-size: 15px; }
        .qty-preset { padding: 6px 12px; font-size: 13px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
        .qty-preset:hover { background: #2c2340; color: #fff; }
        .excess-section { background: var(--panel); border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 4px solid var(--warn); }
        .excess-section h3 { color: var(--warn); margin: 0 0 10px 0; }
        .excess-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

        .stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
        .station-card { background: var(--panel); padding: 12px; border-radius: 10px; border-left: 4px solid var(--accent); }
        .station-card.craftable { border-left-color: var(--warn); }
        .station-name { font-weight: bold; color: var(--text); font-size: 14px; }
        .station-status { font-size: 11px; margin-top: 4px; }
        .station-status.craft { color: var(--warn); }
        .station-status.buy { color: var(--muted); }

        .bonus-banner { background: linear-gradient(90deg, #241838, #181225); border-left: 4px solid #8b6cf0; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .bonus-banner-title { font-size: 14px; color: var(--text); margin-bottom: 8px; }
        .bonus-banner-value { color: var(--accent-2); font-weight: bold; }
        .bonus-banner-hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
        .bonus-input-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
        .bonus-input-row label { color: var(--muted); font-size: 14px; }
        .bonus-input-row select { padding: 6px 12px; font-size: 14px; min-width: 90px; }
        .variant { border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; overflow: hidden; background: #120e1b; }
        .variant > summary { cursor: pointer; position: relative; display: grid; grid-template-columns: 1.6fr .9fr .9fr .9fr .7fr; gap: 8px; align-items: center; padding: 12px 14px 12px 32px; list-style: none; }
        .variant > summary::-webkit-details-marker { display: none; }
        .variant > summary::before { content: "▸"; position: absolute; left: 12px; color: var(--accent); }
        .variant[open] > summary { background: var(--panel-2); }
        .variant[open] > summary::before { content: "▾"; }
        .variant-list { padding: 4px 8px 10px; }
        .variant-head { display: grid; grid-template-columns: 1.6fr .9fr .9fr .9fr .7fr; gap: 8px; padding: 8px 14px 0; color: var(--muted); font-size: 12px; }
        .craft-summary-item.is-link { cursor: pointer; border-radius: 10px; }
        .craft-summary-item.is-link:hover { background: rgba(139, 108, 240, .12); }
        @media (max-width: 760px) {
            .variant > summary, .variant-head { grid-template-columns: 1fr 1fr; }
            body { padding: 10px; }
            .topbar { flex-direction: column; align-items: stretch; }
            .tabs { width: 100%; }
            .tab { flex: 1; }
            .items-grid { grid-template-columns: 1fr; }
            .controls select, #refreshBtn { flex: 1 1 140px; }
            .modal { padding: 16px; }
            .craft-list-profit { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div>
                <h1>Stalzone</h1>
                <p class="subtitle">Аукцион и крафт</p>
            </div>
            <div class="tabs">
                <button class="tab active" data-tab="market">Аукцион</button>
                <button class="tab" data-tab="crafts">Крафты</button>
            </div>
        </header>

        <div id="tab-market">
            <div class="controls">
                <select id="categorySelect"><option value="">Все категории</option></select>
                <input type="text" id="searchInput" placeholder="Поиск по названию или ID...">
                <select id="sortSelect">
                    <option value="name">По названию (А-Я)</option>
                    <option value="price_asc">По цене ↑</option>
                    <option value="price_desc">По цене ↓</option>
                    <option value="dev_asc">По скидке</option>
                    <option value="dev_desc">По наценке</option>
                    <option value="amount_desc">По количеству</option>
                </select>
                <button id="refreshBtn">Обновить</button>
            </div>
            <div class="stats-bar"><span id="resultCount">Загрузка...</span></div>
            <div class="items-grid" id="itemsGrid"></div>
            <div id="sentinel" style="height: 20px;"></div>
        </div>

        <div id="tab-crafts" style="display:none;">
            <div class="controls">
                <select id="craftSkillSelect"><option value="">Все навыки</option></select>
                <select id="craftLevelSelect">
                    <option value="">Любой уровень рецепта</option>
                    <option value="1">Рецепт ур. 1</option>
                    <option value="2">Рецепт ур. 2</option>
                    <option value="3">Рецепт ур. 3</option>
                    <option value="4">Рецепт ур. 4</option>
                    <option value="5">Рецепт ур. 5</option>
                </select>
                <select id="craftSortSelect">
                    <option value="profit_desc">Сначала выгодные</option>
                    <option value="profit_asc">Сначала убыточные</option>
                    <option value="name">По названию (А-Я)</option>
                    <option value="level_asc">По уровню рецепта ↑</option>
                    <option value="level_desc">По уровню рецепта ↓</option>
                    <option value="cost_asc">По себестоимости ↑</option>
                    <option value="cost_desc">По себестоимости ↓</option>
                </select>
                <input type="text" id="craftSearchInput" placeholder="Поиск рецепта...">
            </div>
            <div class="stats-bar"><span id="craftResultCount">Загрузка...</span></div>
            <div id="craftListContainer">
                <div class="empty-state">Загрузка рецептов...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="craftModalOverlay" style="display:none;">
        <div class="modal" style="max-width: 950px;">
            <button class="modal-close" id="craftModalClose">×</button>
            <div id="craftModalContent"></div>
        </div>
    </div>

    <script>
        let allData = {};
        let catalogData = {};
        let craftsData = {};
        let salesData = {};
        let itemIndex = {};
        let itemsCache = [];
        let favorites = [];
        let filteredItems = [];
        let currentChunk = 0;
        const CHUNK_SIZE = 48;
        let currentChart = null;
        const FAV_STORAGE_KEY = 'sz_favorites';
        const SKILL_LEVELS_KEY = 'sz_skill_levels';

        const CATEGORY_NAMES = {
            "weapon": "Оружие", "weapon_modules": "Модули оружия", "attachment": "Обвесы",
            "ammo": "Патроны", "bullet": "Патроны", "armor": "Костюмы", "armour": "Костюмы",
            "artefact": "Артефакты", "artifact": "Артефакты", "backpacks": "Рюкзаки и сумки",
            "backpack": "Рюкзаки и сумки", "containers": "Контейнеры", "container": "Контейнеры",
            "medicine": "Медикаменты и еда", "meds": "Медикаменты и еда", "grenade": "Гранаты",
            "grenades": "Гранаты", "device": "Устройства", "devices": "Устройства",
            "supply": "Расходники", "supplies": "Расходники", "misc": "Разное", "other": "Прочее"
        };
        const CATEGORY_ORDER = [
            "weapon", "weapon_modules", "attachment", "ammo", "bullet", "armor", "armour",
            "backpacks", "backpack", "artefact", "artifact", "containers", "container",
            "medicine", "meds", "grenade", "grenades", "device", "devices", "supply",
            "supplies", "misc", "other"
        ];
        const FAVORITES_KEY = "__favorites__";

        const SKILL_INFO = {
            "Боеприпасы":           { icon: "🎯", desc: "боеприпасы, заготовки",                        order: 1 },

        function skillOrder(name) {
            const info = SKILL_INFO[name];
            return info ? info.order : 9999;
        }
        function skillIcon(name) {
            const info = SKILL_INFO[name];
            return info ? info.icon : "❓";
        }
        function skillDesc(name) {
            const info = SKILL_INFO[name];
            return info ? info.desc : "";
        }
        function subcatOrder(skill, subcat) {
            const list = SUBCAT_ORDER[skill] || [];
            const idx = list.indexOf(subcat);
            return idx === -1 ? 9999 : idx;
        }

        function categoryName(key) {
            if (key === FAVORITES_KEY) return "⭐ Избранное";
            return CATEGORY_NAMES[key] || key;
        }
        function categoryOrder(key) {
            if (key === FAVORITES_KEY) return -1;
            const idx = CATEGORY_ORDER.indexOf(key);
            return idx === -1 ? 9999 : idx;
        }

        function typicalSale(id) {
            const sales = (salesData[id] || []).filter(s => s && s.avg > 0);
            if (!sales.length) return 0;
            const cutoff = Date.now() - 14 * 86400000;
            let recent = sales.filter(s => {
                const t = Date.parse(s.t);
                return Number.isFinite(t) && t >= cutoff;
            });
            if (!recent.length) recent = sales.slice(-14);
            const avgs = recent.map(s => s.avg).sort((a, b) => a - b);
            const median = avgs[Math.floor(avgs.length / 2)];
            const clean = recent.filter(s => s.avg <= median * 8);
            const src = clean.length ? clean : recent;
            const qty = src.reduce((sum, s) => sum + (s.a || 0), 0);
            if (!qty) return median;
            return Math.round(src.reduce((sum, s) => sum + s.avg * (s.a || 0), 0) / qty);
        }
        function lastListing(id) {
            const hist = allData[id];
            if (!hist || !hist.length) return null;
            return hist[hist.length - 1];
        }
        function resolveIcon(src) {
            if (!src) return '';
            const db = 'https://raw.githubusercontent.com/EXBO-Studio/stalzone-database/main/';
            let path = src.replace(/\.webp(\?.*)?$/i, '.png');
            if (path.includes('stalzone-database')) {
                path = path.split('stalzone-database/')[1]
                    .replace(/^raw\/main\//, '')
                    .replace(/^blob\/main\//, '')
                    .replace(/^main\//, '');
                return db + path;
            }
            if (path.startsWith('http')) return path;
            path = path.replace(/^\/+/, '');
            if (!path.startsWith('ru/')) path = 'ru/' + path;
            return db + path;
        }
        function itemCatalog(id) {
            return itemIndex[id] || (craftsData._items || {})[id] || {};
        }
        function recipeIds() {
            return Object.keys(craftsData).filter(id => id !== '_items');
        }
        function humanName(id, ...names) {
            const catalog = itemCatalog(id);
            return [catalog.name, ...names].find(n => n && n !== id) || id;
        }
        function humanIcon(id, ...icons) {
            const catalog = itemCatalog(id);
            return resolveIcon(catalog.icon || icons.find(Boolean) || '');
        }
        function rememberItem(id, name, icon) {
            if (!id) return;
            const prev = itemIndex[id] || {};
            const nextName = (name && name !== id) ? name : prev.name;
            const nextIcon = resolveIcon(icon || prev.icon || '');
            itemIndex[id] = { name: nextName || prev.name || id, icon: nextIcon };
        }
        function ingestCatalog() {
            Object.keys(catalogData).forEach(id => {
                const row = catalogData[id] || {};
                rememberItem(id, row.name, row.icon);
            });
        }
        function ingestRecipes(data) {
            const list = (data && data.recipes) || [];
            list.forEach(rec => {
                const id = rec.itemId;
                if (id) rememberItem(id, rec.name, rec.icon);
                (rec.resources || rec.ingredients || []).forEach(res => {
                    const rid = res.itemId || res.id;
                    rememberItem(rid, res.name, res.icon);
                });
            });
        }
        function ingestCrafts() {
            const meta = craftsData._items || {};
            Object.keys(meta).forEach(id => rememberItem(id, meta[id].name, meta[id].icon));
            recipeIds().forEach(id => {
                const craft = craftsData[id] || {};
                rememberItem(id, craft.name, craft.icon);
                (craft.ingredients || []).forEach(ing => rememberItem(ing.id, ing.name, ing.icon));
            });
        }
        function resolveNode(nodeOrId) {
            if (!nodeOrId) return { id: '', name: '', icon: '', ingredients: [], sell_price: 0, craftable: false };
            const id = typeof nodeOrId === 'string' ? nodeOrId : nodeOrId.id;
            const craft = craftsData[id] || {};
            const last = lastListing(id) || {};
            const fromNode = typeof nodeOrId === 'object' ? nodeOrId : {};
            const amount = fromNode.amount;
            return {
                ...craft,
                id,
                name: humanName(id, fromNode.name, craft.name, last.name),
                icon: humanIcon(id, fromNode.icon, craft.icon, last.icon),
                sell_price: last.price || craft.sell_price || typicalSale(id) || 0,
                craftable: Boolean(craft.ingredients && craft.ingredients.length),
                ingredients: craft.ingredients || [],
                amount
            };
        }
        function iconError(img) {
            const id = img.dataset.id;
            const n = Number(img.dataset.try || 0);
            const paths = [
                `ru/icons/misc/${id}.png`,
                `ru/icons/supply/medicine/${id}.png`,
                `ru/icons/supply/${id}.png`,
                `ru/icons/artefact/${id}.png`,
                `ru/icons/bullet/${id}.png`
            ];
            if (!id || n >= paths.length) {
                img.onerror = null;
                img.replaceWith(Object.assign(document.createElement('div'), {
                    className: img.className,
                    textContent: '?'
                }));
                return;
            }
            img.dataset.try = String(n + 1);
            img.src = 'https://raw.githubusercontent.com/EXBO-Studio/stalzone-database/main/' + paths[n];
        }
        function computeBonus(requiredLevel, myLevel) {
            if (!myLevel || myLevel <= requiredLevel) {
                return { bonusLevels: 0, chance: 0, guaranteed: 0, fractional: 0, multiplier: 1 };
            }
            const bonusLevels = myLevel - requiredLevel;
            const chance = bonusLevels * 75;
            const guaranteed = Math.floor(chance / 100);
            const fractional = (chance % 100) / 100;
            const multiplier = 1 + guaranteed + fractional;
            return { bonusLevels, chance, guaranteed, fractional, multiplier };
        }

        function loadSkillLevels() {
            try { return JSON.parse(localStorage.getItem(SKILL_LEVELS_KEY) || '{}'); } catch { return {}; }
        }
        function saveSkillLevels(levels) {
            localStorage.setItem(SKILL_LEVELS_KEY, JSON.stringify(levels));
        }
        function getMyLevel(skill) {
            const levels = loadSkillLevels();
            return levels[skill] || null;
        }
        function setMyLevel(skill, level) {
            const levels = loadSkillLevels();
            if (level) levels[skill] = level;
            else delete levels[skill];
            saveSkillLevels(levels);
        }

        function loadFavorites() {
            try { return JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || '[]'); } catch { return []; }
        }
        function saveFavorites() { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites)); }
        function isFavorite(id) { return favorites.includes(id); }
        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx >= 0) favorites.splice(idx, 1);

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {

                document.getElementById('tab-market').style.display = tabName === 'market' ? 'block' : 'none';

                if (tabName === 'crafts') renderCraftList();

        async function fetchJson(url, bust) {
            const resp = await fetch(bust ? url + '?t=' + Date.now() : url);
            if (!resp.ok) throw new Error(url + ' HTTP ' + resp.status);
            return resp.json();
        }

        async function loadData(force) {
            els.resultCount.textContent = 'Загрузка данных...';
            els.craftResultCount.textContent = 'Загрузка данных...';
            try {
                allData = await fetchJson('prices.json', force);
                buildItemsCache();
                populateCategories();
                applyFilters();
                els.resultCount.textContent = `Загружено: ${itemsCache.length} предметов`;
            } catch (e) {
                console.error(e);
                els.resultCount.textContent = 'Не удалось загрузить prices.json';
                return;
            }
            loadSecondary(force);
        }

        async function loadSecondary(force) {
            try {
                const [crafts, sales, recipes, catalog] = await Promise.all([
                    fetchJson('crafts.json', force).catch(() => ({})),
                    fetchJson('sales_history.json', force).catch(() => ({})),
                    fetchJson('recipes.json', force).catch(() => ({})),
                    fetchJson('items.json', force).catch(() => ({}))
                ]);
                craftsData = crafts;
                salesData = sales;
                catalogData = catalog && typeof catalog === 'object' && !Array.isArray(catalog) ? catalog : {};
                ingestCatalog();
                ingestCrafts();
                ingestRecipes(recipes);
                buildItemsCache();
                populateCategories();
                populateCraftSkills();
                applyFilters();
                if (document.getElementById('tab-crafts').style.display !== 'none') renderCraftList();
                els.craftResultCount.textContent = `Рецептов: ${recipeIds().length}`;
            } catch (e) {
                console.error(e);
            }
        }

        function seenOnMarket(id) {
            const hist = allData[id];
            if (hist && hist.some(point => point && point.price > 0)) return true;
            const sales = salesData[id];
            return Array.isArray(sales) && sales.some(entry => entry && ((entry.a || 0) > 0 || (entry.avg || 0) > 0));
        }
        function buildItemsCache() {
            const ids = new Set([
                ...Object.keys(allData),
                ...Object.keys(salesData).filter(id => id !== '_updated_at')
            ].filter(seenOnMarket));
            itemsCache = [...ids].map(id => {
                const hist = allData[id];
                const last = hist && hist.length ? hist[hist.length - 1] : null;
                const meta = catalogData[id] || {};
                const cur = last ? (last.price || 0) : 0;
                const avg = typicalSale(id) || (hist && hist.length ? hist.reduce((sum, h) => sum + h.price, 0) / hist.length : 0);
                const priced = cur > 0;
                const dev = priced && avg > 0 ? ((cur - avg) / avg) * 100 : 0;
                return {
                    id,
                    name: humanName(id, last && last.name, meta.name),
                    icon: humanIcon(id, last && last.icon, meta.icon),
                    category: (last && last.category) || meta.category || 'other',
                    price: cur,
                    priced,
                    avg,
                    deviation: dev,
                    total_amount: (last && last.total_amount) || 0,
                    lots_count: (last && last.lots_count) || 0,
                    lastRecord: last
                };
            }).filter(item => item.id);
        }

        function populateCategories() {
            const current = els.categorySelect.value;
            els.categorySelect.innerHTML = '';
            const favOpt = document.createElement('option');
            favOpt.value = FAVORITES_KEY;
            favOpt.textContent = `⭐ Избранное (${favorites.length})`;
            els.categorySelect.appendChild(favOpt);
            const allOpt = document.createElement('option');
            allOpt.value = '';
            allOpt.textContent = 'Все категории';
            els.categorySelect.appendChild(allOpt);
            const counts = {};
            itemsCache.forEach(item => { counts[item.category] = (counts[item.category] || 0) + 1; });
            const sortedCats = Object.keys(counts).sort((a, b) => {
                const oa = categoryOrder(a), ob = categoryOrder(b);
                if (oa !== ob) return oa - ob;
                return categoryName(a).localeCompare(categoryName(b), 'ru');
            });
            sortedCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${categoryName(cat)} (${counts[cat]})`;
                els.categorySelect.appendChild(opt);
            });
            if (current) els.categorySelect.value = current;
            else els.categorySelect.value = '';
        }

        function populateCraftSkills() {
            const counts = {};
            recipeIds().forEach(id => {
                const craft = craftsData[id];
                const skill = craft.skill || "Сырье и материалы";
                counts[skill] = (counts[skill] || 0) + 1;
            });
            const current = els.craftSkillSelect.value;
            els.craftSkillSelect.innerHTML = '<option value="">Все навыки</option>';
            const sortedSkills = Object.keys(counts).sort((a, b) => skillOrder(a) - skillOrder(b));
            sortedSkills.forEach(skill => {
                const opt = document.createElement('option');
                opt.value = skill;
                opt.textContent = `${skillIcon(skill)} ${skill} (${counts[skill]})`;
                els.craftSkillSelect.appendChild(opt);
            });
            if (current) els.craftSkillSelect.value = current;
        }

        function applyFilters() {
            const cat = els.categorySelect.value;
            const query = els.searchInput.value.toLowerCase().trim();
            const sort = els.sortSelect.value;
            let items = itemsCache.slice();
            if (cat === FAVORITES_KEY) items = items.filter(it => isFavorite(it.id));
            else if (cat) items = items.filter(it => it.category === cat);
            if (query) {
                items = items.filter(it =>
                    it.id.toLowerCase().includes(query) || it.name.toLowerCase().includes(query)
                );
            }
            switch (sort) {
                case 'name': items.sort((a, b) => a.name.localeCompare(b.name, 'ru')); break;
                case 'price_asc': items.sort((a, b) => a.price - b.price); break;
                case 'price_desc': items.sort((a, b) => b.price - a.price); break;
                case 'dev_asc': items.sort((a, b) => a.deviation - b.deviation); break;
                case 'dev_desc': items.sort((a, b) => b.deviation - a.deviation); break;
                case 'amount_desc': items.sort((a, b) => b.total_amount - a.total_amount); break;
            }
            filteredItems = items;
            currentChunk = 0;
            els.itemsGrid.innerHTML = '';
            if (filteredItems.length === 0) {
                if (cat === FAVORITES_KEY && favorites.length === 0) {
                    els.itemsGrid.innerHTML = '<div class="empty-state">⭐ В избранном пока пусто.</div>';
                } else {
                    els.itemsGrid.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                }
                els.resultCount.textContent = 'Найдено: 0';
                els.sentinel.style.display = 'none';
                return;
            }
            els.resultCount.textContent = `Найдено: ${filteredItems.length}`;
            els.sentinel.style.display = 'block';
            renderNextChunk();
        }

        function renderNextChunk() {
            const start = currentChunk * CHUNK_SIZE;
            if (start >= filteredItems.length) return;
            const end = Math.min(start + CHUNK_SIZE, filteredItems.length);
            const fragment = document.createDocumentFragment();
            for (let i = start; i < end; i++) {
                fragment.appendChild(createCard(filteredItems[i]));
            }
            els.itemsGrid.appendChild(fragment);
            currentChunk++;
            if (currentChunk * CHUNK_SIZE >= filteredItems.length) {
                els.sentinel.style.display = 'none';
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.dataset.id = item.id;
            const iconHtml = item.icon
                ? `<img class="card-icon" src="${item.icon}" alt="" loading="lazy" decoding="async" draggable="false" onerror="this.outerHTML='<div class=&quot;card-icon-empty&quot;>?</div>'">`
                : `<div class="card-icon-empty">?</div>`;
            let devClass = 'neutral', devText = '—';
            if (item.priced && item.deviation > 0.5) { devClass = 'red'; devText = '+' + item.deviation.toFixed(1) + '%'; }
            else if (item.priced && item.deviation < -0.5) { devClass = 'green'; devText = item.deviation.toFixed(1) + '%'; }
            else if (item.priced) { devText = '0%'; }
            const priceText = item.priced ? `${item.price.toLocaleString('ru-RU')} ₽` : 'нет лотов';
            const fav = isFavorite(item.id);
            card.innerHTML = `
                <button class="card-star ${fav ? 'active' : ''}" data-star="${item.id}" title="${fav ? 'Убрать из избранного' : 'В избранное'}">★</button>
                ${iconHtml}
                <div class="card-body">
                    <div class="card-name">${escapeHtml(item.name)}</div>
                    <div class="card-price">${priceText}</div>
                    <div class="card-meta">
                        <span class="card-dev ${devClass}">${devText}</span>
                        <span>· ${item.total_amount.toLocaleString('ru-RU')} шт</span>
                    </div>
                </div>
            `;
            return card;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
