<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Auction Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2f; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #61dafb; text-align: center; margin-top: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        .tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 25px; border-bottom: 1px solid #3a3a4f; }
        .tab { padding: 12px 24px; background: transparent; border: none; color: #888; font-size: 16px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
        .tab:hover { color: #ccc; }
        .tab.active { color: #61dafb; border-bottom-color: #61dafb; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; align-items: center; }
        input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2b2b3c; color: white; font-size: 15px; }
        input { min-width: 180px; }
        button { cursor: pointer; }
        #refreshBtn { background: #61dafb; color: #1e1e2f; font-weight: bold; border: none; }
        #refreshBtn:hover { background: #4fa8c7; }
        .stats-bar { text-align: center; color: #888; font-size: 14px; margin-bottom: 15px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .item-card { background: #2b2b3c; border-radius: 10px; padding: 14px 10px 12px; cursor: pointer; position: relative; transition: all 0.15s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid transparent; }
        .item-card:hover { background: #32324a; transform: translateY(-2px); border-color: #61dafb; }
        .card-star { position: absolute; top: 4px; right: 4px; background: transparent; border: none; color: #555; font-size: 22px; cursor: pointer; padding: 2px 7px; line-height: 1; border-radius: 4px; }
        .card-star:hover { color: #888; }
        .card-star.active { color: #ffc107; }
        .card-icon { width: 64px; height: 64px; object-fit: contain; border-radius: 6px; }
        .card-icon-empty { width: 64px; height: 64px; background: #1e1e2f; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 24px; }
        .card-name { font-size: 13px; color: #e0e0e0; line-height: 1.3; min-height: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; width: 100%; }
        .card-price { font-size: 16px; font-weight: bold; color: #61dafb; }
        .card-meta { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 12px; color: #888; flex-wrap: wrap; }
        .card-dev { font-weight: bold; }
        .card-dev.green { color: #4caf50; }
        .card-dev.red { color: #f44336; }
        .card-dev.neutral { color: #888; }
        .empty-state { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; grid-column: 1 / -1; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; z-index: 100; overflow-y: auto; }
        .modal { background: #1e1e2f; border-radius: 12px; max-width: 1100px; width: 100%; padding: 25px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .modal-close { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: #888; font-size: 28px; cursor: pointer; padding: 0 8px; line-height: 1; }
        .modal-close:hover { color: #fff; }
        .item-header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; padding-right: 40px; }
        .item-icon { width: 96px; height: 96px; border-radius: 10px; background: #2b2b3c; object-fit: contain; flex-shrink: 0; }
        .item-icon-empty { width: 96px; height: 96px; border-radius: 10px; background: #2b2b3c; display: flex; align-items: center; justify-content: center; color: #444; font-size: 36px; flex-shrink: 0; }
        .item-title { font-size: 24px; font-weight: bold; color: #61dafb; margin-bottom: 6px; }
        .item-id { font-size: 14px; color: #888; }
        .category-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; background: #3a3a4f; font-size: 12px; color: #61dafb; margin-left: 10px; vertical-align: middle; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-item { background: #2b2b3c; padding: 14px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: #61dafb; }
        .stat-label { font-size: 12px; color: #aaa; margin-top: 4px; }
        .stat-sub { font-size: 11px; color: #888; margin-top: 3px; }
        .green { color: #4caf50 !important; }
        .red { color: #f44336 !important; }
        .chart-container { background: #2b2b3c; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #3a3a4f; }
        th { color: #61dafb; font-weight: bold; font-size: 14px; }
        td { font-size: 15px; }
        tr:hover { background: #32324a; }
        .price-cell { color: #61dafb; font-weight: bold; }
        .time-cell { color: #aaa; font-size: 13px; }
        .lots-title { color: #61dafb; margin-top: 0; margin-bottom: 10px; }
        canvas { max-height: 350px; }

        .craft-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .craft-list-item { background: #2b2b3c; border-radius: 8px; padding: 12px 15px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.15s; border: 1px solid transparent; }
        .craft-list-item:hover { background: #32324a; border-color: #61dafb; }
        .craft-list-icon { width: 44px; height: 44px; object-fit: contain; border-radius: 4px; background: #1e1e2f; flex-shrink: 0; }
        .craft-list-info { flex: 1; min-width: 0; }
        .craft-list-name { font-weight: bold; color: #e0e0e0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .craft-list-profit { font-weight: bold; text-align: right; flex-shrink: 0; }
        .craft-list-profit.green { color: #4caf50; }
        .craft-list-profit.red { color: #f44336; }
        .craft-list-stations { font-size: 11px; color: #666; margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
        .station-mini { background: #26263a; padding: 1px 6px; border-radius: 3px; color: #888; }

        .skill-header { background: linear-gradient(90deg, #2b2b3c, #32324a); padding: 15px; border-radius: 8px; margin-bottom: 12px; margin-top: 20px; display: flex; align-items: center; gap: 15px; }
        .skill-header:first-child { margin-top: 0; }
        .skill-header-icon { width: 48px; height: 48px; border-radius: 8px; background: #1e1e2f; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .skill-header-info { flex: 1; }
        .skill-header-name { font-size: 18px; font-weight: bold; color: #61dafb; }
        .skill-header-desc { font-size: 13px; color: #888; margin-top: 3px; }
        .subcat-header { color: #aaa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 0; padding-left: 8px; border-left: 3px solid #61dafb; }

        .skill-level-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #2b2b3c; border: 1px solid #555; color: #ccc; font-weight: bold; }
        .skill-level-badge.lvl-1 { border-color: #4caf50; color: #4caf50; }
        .skill-level-badge.lvl-2 { border-color: #8bc34a; color: #8bc34a; }
        .skill-level-badge.lvl-3 { border-color: #ffc107; color: #ffc107; }
        .skill-level-badge.lvl-4 { border-color: #ff9800; color: #ff9800; }
        .skill-level-badge.lvl-5 { border-color: #f44336; color: #f44336; }

        .craft-node { background: #2b2b3c; border-radius: 8px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #444; }
        .craft-node.profitable { border-left-color: #4caf50; }
        .craft-node.unprofitable { border-left-color: #f44336; }
        .craft-node-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .craft-node-icon { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; background: #1e1e2f; }
        .craft-node-name { font-size: 16px; font-weight: bold; color: #61dafb; }
        .craft-node-id { font-size: 12px; color: #888; }
        .craft-ingredients { margin-left: 20px; margin-top: 10px; padding-left: 15px; border-left: 2px dashed #3a3a4f; }
        .craft-ingredient { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
        .craft-ingredient-icon { width: 28px; height: 28px; object-fit: contain; border-radius: 3px; background: #1e1e2f; }
        .craft-ingredient-name { color: #ccc; }
        .craft-ingredient-amount { color: #888; font-size: 12px; }
        .craft-ingredient-cost { color: #61dafb; margin-left: auto; font-weight: bold; }

        details.craft-sub { margin: 4px 0; border-left: 3px solid #61dafb; background: #26263a; border-radius: 6px; overflow: hidden; }
        details.craft-sub > summary { cursor: pointer; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        details.craft-sub > summary::-webkit-details-marker { display: none; }
        details.craft-sub > summary::before { content: "+"; display: inline-block; width: 20px; font-weight: bold; color: #61dafb; text-align: center; }
        details.craft-sub[open] > summary::before { content: "−"; }
        details.craft-sub > summary:hover { background: #32324a; }
        details.craft-sub .craft-sub-body { padding: 8px 12px 12px 24px; border-top: 1px solid #3a3a4f; }

        .shopping-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #2b2b3c; border-radius: 8px; overflow: hidden; }
        .shopping-table th { background: #32324a; padding: 12px; text-align: left; font-size: 13px; color: #61dafb; }
        .shopping-table td { padding: 10px 12px; border-top: 1px solid #3a3a4f; font-size: 14px; }
        .shopping-icon { width: 32px; height: 32px; vertical-align: middle; margin-right: 10px; border-radius: 4px; background: #1e1e2f; object-fit: contain; }
        .no-price { color: #888; font-style: italic; }
        .craft-summary { background: #2b2b3c; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .craft-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .craft-summary-item { text-align: center; }
        .craft-summary-value { font-size: 22px; font-weight: bold; color: #61dafb; }
        .craft-summary-value.green { color: #4caf50; }
        .craft-summary-value.red { color: #f44336; }
        .craft-summary-label { font-size: 12px; color: #888; margin-top: 4px; }
        .qty-input { width: 120px; padding: 10px; border-radius: 6px; background: #2b2b3c; border: 1px solid #444; color: white; font-size: 16px; text-align: center; }
        .qty-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; padding: 15px; background: #2b2b3c; border-radius: 8px; flex-wrap: wrap; }
        .qty-row label { color: #aaa; font-size: 15px; }
        .qty-preset { padding: 6px 12px; font-size: 13px; border-radius: 4px; background: #3a3a4f; border: 1px solid #444; color: #ccc; cursor: pointer; }
        .qty-preset:hover { background: #4a4a5f; color: #fff; }
        .excess-section { background: #2b2b3c; border-radius: 8px; padding: 15px; margin-bottom: 20px; border-left: 4px solid #ffc107; }
        .excess-section h3 { color: #ffc107; margin: 0 0 10px 0; }
        .excess-hint { font-size: 12px; color: #888; margin-top: 8px; }

        .stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
        .station-card { background: #2b2b3c; padding: 12px; border-radius: 8px; border-left: 4px solid #61dafb; }
        .station-card.craftable { border-left-color: #ffc107; }
        .station-name { font-weight: bold; color: #e0e0e0; font-size: 14px; }
        .station-status { font-size: 11px; margin-top: 4px; }
        .station-status.craft { color: #ffc107; }
        .station-status.buy { color: #888; }

        .bonus-banner { background: linear-gradient(90deg, #2a3a4a, #1e2e3e); border-left: 4px solid #61dafb; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .bonus-banner-title { font-size: 14px; color: #e0e0e0; margin-bottom: 8px; }
        .bonus-banner-value { color: #4caf50; font-weight: bold; }
        .bonus-banner-hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.5; }
        .bonus-input-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #3a3a4f; flex-wrap: wrap; }
        .bonus-input-row label { color: #aaa; font-size: 14px; }
        .bonus-input-row select { padding: 6px 12px; font-size: 14px; min-width: 90px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stalzone Auction Monitor</h1>
        <div class="tabs">
            <button class="tab active" data-tab="market">🏪 Аукцион</button>
            <button class="tab" data-tab="crafts">🔨 Крафты</button>
        </div>

        <div id="tab-market">
            <div class="controls">
                <select id="categorySelect"><option value="">Все категории</option></select>
                <input type="text" id="searchInput" placeholder="Поиск по названию или ID...">
                <select id="sortSelect">
                    <option value="name">По названию (А-Я)</option>
                    <option value="price_asc">По цене ↑</option>
                    <option value="price_desc">По цене ↓</option>
                    <option value="dev_asc">По скидке</option>
                    <option value="dev_desc">По наценке</option>
                    <option value="amount_desc">По количеству</option>
                </select>
                <button id="refreshBtn">🔄 Обновить</button>
            </div>
            <div class="stats-bar"><span id="resultCount">Загрузка...</span></div>
            <div class="items-grid" id="itemsGrid"></div>
            <div id="sentinel" style="height: 20px;"></div>
        </div>

        <div id="tab-crafts" style="display:none;">
            <div class="controls">
                <select id="craftSkillSelect"><option value="">Все навыки</option></select>
                <select id="craftLevelSelect">
                    <option value="">Любой уровень рецепта</option>
                    <option value="1">Рецепт ур. 1</option>
                    <option value="2">Рецепт ур. 2</option>
                    <option value="3">Рецепт ур. 3</option>
                    <option value="4">Рецепт ур. 4</option>
                    <option value="5">Рецепт ур. 5</option>
                </select>
                <select id="craftSortSelect">
                    <option value="profit_desc">Сначала выгодные</option>
                    <option value="profit_asc">Сначала убыточные</option>
                    <option value="name">По названию (А-Я)</option>
                    <option value="level_asc">По уровню рецепта ↑</option>
                    <option value="level_desc">По уровню рецепта ↓</option>
                    <option value="cost_asc">По себестоимости ↑</option>
                    <option value="cost_desc">По себестоимости ↓</option>
                </select>
                <input type="text" id="craftSearchInput" placeholder="Поиск рецепта...">
            </div>
            <div class="stats-bar"><span id="craftResultCount">Загрузка...</span></div>
            <div id="craftListContainer">
                <div class="empty-state">Загрузка рецептов...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="modal-overlay" id="craftModalOverlay" style="display:none;">
        <div class="modal" style="max-width: 950px;">
            <button class="modal-close" id="craftModalClose">×</button>
            <div id="craftModalContent"></div>
        </div>
    </div>

    <script>
        let allData = {};
        let craftsData = {};
        let salesData = {};
        let itemsCache = [];
        let favorites = [];
        let filteredItems = [];
        let currentChunk = 0;
        const CHUNK_SIZE = 120;
        let currentChart = null;
        const FAV_STORAGE_KEY = 'sz_favorites';
        const SKILL_LEVELS_KEY = 'sz_skill_levels';

        const CATEGORY_NAMES = {
            "weapon": "Оружие", "weapon_modules": "Модули оружия", "attachment": "Обвесы",
            "ammo": "Патроны", "bullet": "Патроны", "armor": "Костюмы", "armour": "Костюмы",
            "artefact": "Артефакты", "artifact": "Артефакты", "backpacks": "Рюкзаки и сумки",
            "backpack": "Рюкзаки и сумки", "containers": "Контейнеры", "container": "Контейнеры",
            "medicine": "Медикаменты и еда", "meds": "Медикаменты и еда", "grenade": "Гранаты",
            "grenades": "Гранаты", "device": "Устройства", "devices": "Устройства",
            "supply": "Расходники", "supplies": "Расходники", "misc": "Разное", "other": "Прочее"
        };
        const CATEGORY_ORDER = [
            "weapon", "weapon_modules", "attachment", "ammo", "bullet", "armor", "armour",
            "backpacks", "backpack", "artefact", "artifact", "containers", "container",
            "medicine", "meds", "grenade", "grenades", "device", "devices", "supply",
            "supplies", "misc", "other"
        ];
        const FAVORITES_KEY = "__favorites__";

        const SKILL_INFO = {
            "Боеприпасы":           { icon: "🎯", desc: "боеприпасы, заготовки",                        order: 1 },
            "Пиротехника":          { icon: "💥", desc: "взрывчатка, гранаты, порох",                   order: 2 },
            "Защитное снаряжение":  { icon: "🛡️", desc: "бронепластины",                                order: 3 },
            "Инженерия":            { icon: "🔧", desc: "пристройки, материалы, ключницы",              order: 4 },
            "Кулинария":            { icon: "🍲", desc: "ингредиенты, еда",                             order: 5 },
            "Самогоноварение":      { icon: "🍷", desc: "сырьё, алкоголь",                              order: 6 },
            "Медицина":             { icon: "💊", desc: "медикаменты",                                  order: 7 },
            "Сырье и материалы":    { icon: "⚙️", desc: "материалы на верстаке и лабораторном столе",   order: 8 }
        };

        const SUBCAT_ORDER = {
            "Сырье и материалы": ["Заготовки", "Сырье и компоненты", "Электронные компоненты",
                                  "Растворы", "Смеси", "Реагенты", "Гематология", "Ферменты",
                                  "Металлы", "Ингредиенты", "Сырье"],
            "Медицина": ["Лечение", "Защита", "Защита от заражений", "Подвижность",
                         "Кратковременное усиление", "Прочее"],
            "Боеприпасы": ["9 мм", "10 мм", "5.45 мм", "5.56 мм", "7.62 мм", "9x39 мм",
                           "12.7 мм", "12 калибр", "23x75 мм"],
            "Пиротехника": ["Ручные гранаты", "Подствольные гранаты", "Прочее"],
            "Кулинария": ["Усиление", "Подвижность", "Ингредиенты"],
            "Самогоноварение": ["Усиление", "Кратковременное усиление", "Сырье", "Прочее"],
            "Защитное снаряжение": ["Стальные", "Керамические", "Композитные"],
            "Инженерия": ["Генераторная", "Мастерская", "Кухня", "Лаборатория", "Хранилище",
                          "Ключницы", "Схроны", "Стулья и диваны", "Столы", "Шкафы и тумбы",
                          "Кровати", "Другое", "Прочее"]
        };

        function skillOrder(name) {
            const info = SKILL_INFO[name];
            return info ? info.order : 9999;
        }
        function skillIcon(name) {
            const info = SKILL_INFO[name];
            return info ? info.icon : "❓";
        }
        function skillDesc(name) {
            const info = SKILL_INFO[name];
            return info ? info.desc : "";
        }
        function subcatOrder(skill, subcat) {
            const list = SUBCAT_ORDER[skill] || [];
            const idx = list.indexOf(subcat);
            return idx === -1 ? 9999 : idx;
        }

        function categoryName(key) {
            if (key === FAVORITES_KEY) return "⭐ Избранное";
            return CATEGORY_NAMES[key] || key;
        }
        function categoryOrder(key) {
            if (key === FAVORITES_KEY) return -1;
            const idx = CATEGORY_ORDER.indexOf(key);
            return idx === -1 ? 9999 : idx;
        }

        function computeBonus(requiredLevel, myLevel) {
            if (!myLevel || myLevel <= requiredLevel) {
                return { bonusLevels: 0, chance: 0, guaranteed: 0, fractional: 0, multiplier: 1 };
            }
            const bonusLevels = myLevel - requiredLevel;
            const chance = bonusLevels * 75;
            const guaranteed = Math.floor(chance / 100);
            const fractional = (chance % 100) / 100;
            const multiplier = 1 + guaranteed + fractional;
            return { bonusLevels, chance, guaranteed, fractional, multiplier };
        }

        function loadSkillLevels() {
            try { return JSON.parse(localStorage.getItem(SKILL_LEVELS_KEY) || '{}'); } catch { return {}; }
        }
        function saveSkillLevels(levels) {
            localStorage.setItem(SKILL_LEVELS_KEY, JSON.stringify(levels));
        }
        function getMyLevel(skill) {
            const levels = loadSkillLevels();
            return levels[skill] || null;
        }
        function setMyLevel(skill, level) {
            const levels = loadSkillLevels();
            if (level) levels[skill] = level;
            else delete levels[skill];
            saveSkillLevels(levels);
        }

        function loadFavorites() {
            try { return JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || '[]'); } catch { return []; }
        }
        function saveFavorites() { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites)); }
        function isFavorite(id) { return favorites.includes(id); }
        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx >= 0) favorites.splice(idx, 1);
            else favorites.push(id);
            saveFavorites();
            return isFavorite(id);
        }

        const els = {
            categorySelect: document.getElementById('categorySelect'),
            searchInput: document.getElementById('searchInput'),
            sortSelect: document.getElementById('sortSelect'),
            refreshBtn: document.getElementById('refreshBtn'),
            itemsGrid: document.getElementById('itemsGrid'),
            resultCount: document.getElementById('resultCount'),
            sentinel: document.getElementById('sentinel'),
            modalOverlay: document.getElementById('modalOverlay'),
            modalContent: document.getElementById('modalContent'),
            modalClose: document.getElementById('modalClose'),
            craftSkillSelect: document.getElementById('craftSkillSelect'),
            craftLevelSelect: document.getElementById('craftLevelSelect'),
            craftSortSelect: document.getElementById('craftSortSelect'),
            craftSearchInput: document.getElementById('craftSearchInput'),
            craftListContainer: document.getElementById('craftListContainer'),
            craftResultCount: document.getElementById('craftResultCount'),
            craftModalOverlay: document.getElementById('craftModalOverlay'),
            craftModalContent: document.getElementById('craftModalContent'),
            craftModalClose: document.getElementById('craftModalClose'),
        };

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                document.getElementById('tab-market').style.display = tabName === 'market' ? 'block' : 'none';
                document.getElementById('tab-crafts').style.display = tabName === 'crafts' ? 'block' : 'none';
                if (tabName === 'crafts') renderCraftList();
            });
        });

        async function loadData() {
            els.resultCount.textContent = 'Загрузка данных...';
            els.craftResultCount.textContent = 'Загрузка данных...';
            try {
                const [pricesResp, craftsResp, salesResp] = await Promise.all([
                    fetch('prices.json?t=' + Date.now()),
                    fetch('crafts.json?t=' + Date.now()).catch(() => null),
                    fetch('sales_history.json?t=' + Date.now()).catch(() => null)
                ]);
                allData = await pricesResp.json();
                craftsData = (craftsResp && craftsResp.ok) ? await craftsResp.json() : {};
                salesData = (salesResp && salesResp.ok) ? await salesResp.json() : {};
                buildItemsCache();
                populateCategories();
                populateCraftSkills();
                applyFilters();
                els.resultCount.textContent = `Загружено: ${itemsCache.length} предметов`;
            } catch (e) {
                console.error(e);
                els.resultCount.textContent = '❌ Не удалось загрузить prices.json';
            }
        }

        function buildItemsCache() {
            itemsCache = Object.keys(allData).map(id => {
                const hist = allData[id];
                if (!hist || !hist.length) return null;
                const last = hist[hist.length - 1];
                const prices = hist.map(h => h.price);
                const cur = prices[prices.length - 1];
                const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
                const dev = avg > 0 ? ((cur - avg) / avg) * 100 : 0;
                return {
                    id, name: last.name || id, icon: last.icon || '',
                    category: last.category || 'other',
                    price: cur, avg, deviation: dev,
                    total_amount: last.total_amount || 0,
                    lots_count: last.lots_count || 0,
                    lastRecord: last
                };
            }).filter(Boolean);
        }

        function populateCategories() {
            const current = els.categorySelect.value;
            els.categorySelect.innerHTML = '';
            const favOpt = document.createElement('option');
            favOpt.value = FAVORITES_KEY;
            favOpt.textContent = `⭐ Избранное (${favorites.length})`;
            els.categorySelect.appendChild(favOpt);
            const allOpt = document.createElement('option');
            allOpt.value = '';
            allOpt.textContent = 'Все категории';
            els.categorySelect.appendChild(allOpt);
            const counts = {};
            itemsCache.forEach(item => { counts[item.category] = (counts[item.category] || 0) + 1; });
            const sortedCats = Object.keys(counts).sort((a, b) => {
                const oa = categoryOrder(a), ob = categoryOrder(b);
                if (oa !== ob) return oa - ob;
                return categoryName(a).localeCompare(categoryName(b), 'ru');
            });
            sortedCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${categoryName(cat)} (${counts[cat]})`;
                els.categorySelect.appendChild(opt);
            });
            if (current) els.categorySelect.value = current;
            else els.categorySelect.value = '';
        }

        function populateCraftSkills() {
            const counts = {};
            Object.values(craftsData).forEach(craft => {
                const skill = craft.skill || "Сырье и материалы";
                counts[skill] = (counts[skill] || 0) + 1;
            });
            const current = els.craftSkillSelect.value;
            els.craftSkillSelect.innerHTML = '<option value="">Все навыки</option>';
            const sortedSkills = Object.keys(counts).sort((a, b) => skillOrder(a) - skillOrder(b));
            sortedSkills.forEach(skill => {
                const opt = document.createElement('option');
                opt.value = skill;
                opt.textContent = `${skillIcon(skill)} ${skill} (${counts[skill]})`;
                els.craftSkillSelect.appendChild(opt);
            });
            if (current) els.craftSkillSelect.value = current;
        }

        function applyFilters() {
            const cat = els.categorySelect.value;
            const query = els.searchInput.value.toLowerCase().trim();
            const sort = els.sortSelect.value;
            let items = itemsCache.slice();
            if (cat === FAVORITES_KEY) items = items.filter(it => isFavorite(it.id));
            else if (cat) items = items.filter(it => it.category === cat);
            if (query) {
                items = items.filter(it =>
                    it.id.toLowerCase().includes(query) || it.name.toLowerCase().includes(query)
                );
            }
            switch (sort) {
                case 'name': items.sort((a, b) => a.name.localeCompare(b.name, 'ru')); break;
                case 'price_asc': items.sort((a, b) => a.price - b.price); break;
                case 'price_desc': items.sort((a, b) => b.price - a.price); break;
                case 'dev_asc': items.sort((a, b) => a.deviation - b.deviation); break;
                case 'dev_desc': items.sort((a, b) => b.deviation - a.deviation); break;
                case 'amount_desc': items.sort((a, b) => b.total_amount - a.total_amount); break;
            }
            filteredItems = items;
            currentChunk = 0;
            els.itemsGrid.innerHTML = '';
            if (filteredItems.length === 0) {
                if (cat === FAVORITES_KEY && favorites.length === 0) {
                    els.itemsGrid.innerHTML = '<div class="empty-state">⭐ В избранном пока пусто.</div>';
                } else {
                    els.itemsGrid.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                }
                els.resultCount.textContent = 'Найдено: 0';
                els.sentinel.style.display = 'none';
                return;
            }
            els.resultCount.textContent = `Найдено: ${filteredItems.length}`;
            els.sentinel.style.display = 'block';
            renderNextChunk();
        }

        function renderNextChunk() {
            const start = currentChunk * CHUNK_SIZE;
            if (start >= filteredItems.length) return;
            const end = Math.min(start + CHUNK_SIZE, filteredItems.length);
            const fragment = document.createDocumentFragment();
            for (let i = start; i < end; i++) {
                fragment.appendChild(createCard(filteredItems[i]));
            }
            els.itemsGrid.appendChild(fragment);
            currentChunk++;
            if (currentChunk * CHUNK_SIZE >= filteredItems.length) {
                els.sentinel.style.display = 'none';
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.dataset.id = item.id;
            const iconHtml = item.icon
                ? `<img class="card-icon" src="${item.icon}" alt="" onerror="this.outerHTML='<div class=&quot;card-icon-empty&quot;>?</div>'">`
                : `<div class="card-icon-empty">?</div>`;
            let devClass = 'neutral', devText = '—';
            if (item.deviation > 0.5) { devClass = 'red'; devText = '+' + item.deviation.toFixed(1) + '%'; }
            else if (item.deviation < -0.5) { devClass = 'green'; devText = item.deviation.toFixed(1) + '%'; }
            else { devText = '0%'; }
            const fav = isFavorite(item.id);
            card.innerHTML = `
                <button class="card-star ${fav ? 'active' : ''}" data-star="${item.id}" title="${fav ? 'Убрать из избранного' : 'В избранное'}">★</button>
                ${iconHtml}
                <div class="card-name">${escapeHtml(item.name)}</div>
                <div class="card-price">${item.price.toLocaleString('ru-RU')} ₽</div>
                <div class="card-meta">
                    <span class="card-dev ${devClass}">${devText}</span>
                    <span>· ${item.total_amount.toLocaleString('ru-RU')} шт</span>
                </div>
            `;
            return card;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function openModal(id) {
            const item = itemsCache.find(i => i.id === id);
            if (!item) return;
            const hist = allData[id];
            const sales = (salesData[id] || []).slice();
            const prices = hist.map(h => h.price);
            const last = hist[hist.length - 1];
            const cur = prices[prices.length - 1];
            const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
            const dev = avg > 0 ? ((cur - avg) / avg) * 100 : 0;
            const fav = isFavorite(id);
            const iconHtml = item.icon
                ? `<img class="item-icon" src="${item.icon}" alt="" onerror="this.outerHTML='<div class=&quot;item-icon-empty&quot;>?</div>'">`
                : `<div class="item-icon-empty">?</div>`;
            let devClass = 'green'; if (dev > 0) devClass = 'red';
            let bestLotInfo = '';
            if (last.best_lot_amount && last.best_lot_buyout) {
                bestLotInfo = `Лучший лот: ${last.best_lot_amount} шт за ${last.best_lot_buyout.toLocaleString('ru-RU')} ₽`;
            }
            let lotsHtml = '';
            if (last.lots && last.lots.length) {
                const rows = last.lots.map((lot, i) => {
                    const endTime = lot.endTime ? new Date(lot.endTime).toLocaleString('ru-RU') : '—';
                    return `<tr><td>${i+1}</td><td class="price-cell">${lot.price_per_unit.toLocaleString('ru-RU')} ₽</td><td>${lot.amount.toLocaleString('ru-RU')} шт</td><td>${lot.buyout.toLocaleString('ru-RU')} ₽</td><td class="time-cell">${endTime}</td></tr>`;
                }).join('');
                lotsHtml = `<h3 class="lots-title">📋 Актуальные лоты (${last.lots.length})</h3><table><thead><tr><th>#</th><th>Цена за 1 шт</th><th>Количество</th><th>Цена лота</th><th>Истекает</th></tr></thead><tbody>${rows}</tbody></table>`;
            }

            let salesHtml = '';
            if (sales.length > 0) {
                const totalAmount = sales.reduce((s, e) => s + (e.a || 0), 0);
                const totalSum = sales.reduce((s, e) => s + (e.avg || 0) * (e.a || 0), 0);
                const avgDeal = totalAmount > 0 ? Math.round(totalSum / totalAmount) : 0;
                const lastSales = sales.slice(-30).reverse();
                const rows = lastSales.map(s => {
                    const dt = s.t ? new Date(s.t).toLocaleString('ru-RU') : '—';
                    return `<tr>
                        <td class="time-cell">${dt}</td>
                        <td>${(s.a || 0).toLocaleString('ru-RU')} шт</td>
                        <td class="price-cell">${(s.avg || 0).toLocaleString('ru-RU')} ₽</td>
                        <td style="color:#aaa;font-size:12px;">${(s.min || 0).toLocaleString('ru-RU')} – ${(s.max || 0).toLocaleString('ru-RU')} ₽</td>
                    </tr>`;
                }).join('');
                salesHtml = `
                    <h3 class="lots-title" style="margin-top:25px;">📈 История продаж</h3>
                    <div style="color:#888;font-size:13px;margin-bottom:10px;">
                        Продано за период: <b style="color:#4caf50;">${totalAmount.toLocaleString('ru-RU')} шт</b>
                        · Средняя цена сделки: <b style="color:#4caf50;">${avgDeal.toLocaleString('ru-RU')} ₽</b>
                        · Периодов: ${sales.length}
                    </div>
                    <table>
                        <thead><tr>
                            <th>Время</th><th>Продано</th><th>Средняя цена</th><th>Диапазон</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            } else {
                salesHtml = '<div style="margin-top:20px;padding:12px;color:#888;font-size:13px;">История продаж пока недоступна.</div>';
            }

            els.modalContent.innerHTML = `
                <div class="item-header">
                    ${iconHtml}
                    <div style="flex:1">
                        <div class="item-title"><span>${escapeHtml(item.name)}</span><span class="category-badge">${escapeHtml(categoryName(item.category))}</span></div>
                        <div class="item-id">ID: ${item.id}</div>
                    </div>
                    <button id="modalFavBtn" class="card-star ${fav ? 'active' : ''}" style="position:static; font-size:32px; padding:0 12px;" title="В избранное">★</button>
                </div>
                <div class="stats">
                    <div class="stat-item"><div class="stat-value">${cur.toLocaleString('ru-RU')} ₽</div><div class="stat-label">Цена за 1 шт</div><div class="stat-sub">${bestLotInfo}</div></div>
                    <div class="stat-item"><div class="stat-value">${Math.round(avg).toLocaleString('ru-RU')} ₽</div><div class="stat-label">Средняя (7 дней)</div></div>
                    <div class="stat-item"><div class="stat-value ${devClass}">${(dev > 0 ? '+' : '') + dev.toFixed(1)}%</div><div class="stat-label">Отклонение</div></div>
                    <div class="stat-item"><div class="stat-value">${last.total_amount !== undefined ? last.total_amount.toLocaleString('ru-RU') + ' шт' : '—'}</div><div class="stat-label">Всего на аукционе</div><div class="stat-sub">${last.lots_count !== undefined ? last.lots_count + ' лотов' : ''}</div></div>
                    <div class="stat-item"><div class="stat-value">${prices.length}</div><div class="stat-label">Точек истории</div></div>
                </div>
                <div class="chart-container"><canvas id="modalChart"></canvas></div>
                ${lotsHtml}
                ${salesHtml}
            `;
            const modalFavBtn = document.getElementById('modalFavBtn');
            modalFavBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const nowFav = toggleFavorite(id);
                modalFavBtn.classList.toggle('active', nowFav);
                const favOpt = els.categorySelect.querySelector(`option[value="${FAVORITES_KEY}"]`);
                if (favOpt) favOpt.textContent = `⭐ Избранное (${favorites.length})`;
                document.querySelectorAll(`[data-star="${id}"]`).forEach(btn => btn.classList.toggle('active', nowFav));
                if (els.categorySelect.value === FAVORITES_KEY) applyFilters();
            });
            els.modalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            requestAnimationFrame(() => {
                const ctx = document.getElementById('modalChart').getContext('2d');
                if (currentChart) currentChart.destroy();
                const labels = hist.map(h => new Date(h.timestamp).toLocaleString('ru-RU'));
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            { label: 'Цена за 1 шт', data: prices, borderColor: '#61dafb', backgroundColor: 'rgba(97,218,251,0.1)', borderWidth: 2, pointRadius: 3, fill: true, tension: 0.1 },
                            { label: 'Средняя', data: new Array(prices.length).fill(avg), borderColor: '#f44336', borderWidth: 1, borderDash: [5,5], pointRadius: 0, fill: false },
                            {
    label: 'Продажи',
    data: (() => {
        const result = new Array(hist.length).fill(null);
        for (const s of sales) {
            if (!s.t) continue;
            const saleDay = s.t.slice(0, 10);  // "2026-10-09"
            hist.forEach((h, i) => {
                const histDay = h.timestamp.slice(0, 10);
                if (histDay === saleDay) {
                    result[i] = s.avg;
                }
            });
        }
        return result;
    })(),
                                borderColor: '#4caf50',
                                backgroundColor: '#4caf50',
                                pointRadius: 5,
                                pointStyle: 'rectRot',
                                showLine: false,
                                fill: false
                            }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#e0e0e0' } } }, scales: { x: { ticks: { color: '#aaa', maxTicksLimit: 12 }, grid: { color: '#444' } }, y: { ticks: { color: '#aaa' }, grid: { color: '#444' } } } }
                });
            });
        }

        function closeModal() {
            els.modalOverlay.style.display = 'none';
            document.body.style.overflow = '';
            if (currentChart) { currentChart.destroy(); currentChart = null; }
        }

        function renderCraftList() {
            const query = els.craftSearchInput.value.toLowerCase().trim();
            const skillFilter = els.craftSkillSelect.value;
            const levelFilter = els.craftLevelSelect.value;
            const sortMode = els.craftSortSelect.value;
            const container = els.craftListContainer;

            const recipeIds = Object.keys(craftsData);
            if (recipeIds.length === 0) {
                container.innerHTML = '<div class="empty-state">🔨 Пока нет рецептов.</div>';
                els.craftResultCount.textContent = 'Найдено: 0';
                return;
            }

            let items = recipeIds.map(id => ({ id, ...craftsData[id] }));

            if (skillFilter) {
                items = items.filter(item => (item.skill || "Сырье и материалы") === skillFilter);
            }
            if (levelFilter) {
                const lvl = parseInt(levelFilter);
                items = items.filter(item => (item.skillLevel || 0) === lvl);
            }
            if (query) {
                items = items.filter(item =>
                    item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query)
                );
            }

            switch (sortMode) {
                case 'profit_desc': items.sort((a, b) => (b.profit || 0) - (a.profit || 0)); break;
                case 'profit_asc': items.sort((a, b) => (a.profit || 0) - (b.profit || 0)); break;
                case 'name': items.sort((a, b) => a.name.localeCompare(b.name, 'ru')); break;
                case 'level_asc': items.sort((a, b) => (a.skillLevel || 0) - (b.skillLevel || 0)); break;
                case 'level_desc': items.sort((a, b) => (b.skillLevel || 0) - (a.skillLevel || 0)); break;
                case 'cost_asc': items.sort((a, b) => (a.cost || 0) - (b.cost || 0)); break;
                case 'cost_desc': items.sort((a, b) => (b.cost || 0) - (a.cost || 0)); break;
            }

            els.craftResultCount.textContent = `Найдено рецептов: ${items.length}`;

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено. Попробуйте изменить фильтры.</div>';
                return;
            }

            const grouped = {};
            items.forEach(item => {
                const skill = item.skill || "Сырье и материалы";
                const subcat = item.subcategory || "Прочее";
                if (!grouped[skill]) grouped[skill] = {};
                if (!grouped[skill][subcat]) grouped[skill][subcat] = [];
                grouped[skill][subcat].push(item);
            });

            const sortedSkills = Object.keys(grouped).sort((a, b) => skillOrder(a) - skillOrder(b));

            let html = '';
            sortedSkills.forEach(skill => {
                const total = Object.values(grouped[skill]).reduce((sum, arr) => sum + arr.length, 0);
                html += `
                    <div class="skill-header">
                        <div class="skill-header-icon">${skillIcon(skill)}</div>
                        <div class="skill-header-info">
                            <div class="skill-header-name">${escapeHtml(skill)}</div>
                            <div class="skill-header-desc">${escapeHtml(skillDesc(skill))} · ${total} рецептов</div>
                        </div>
                    </div>
                `;
                const subcats = Object.keys(grouped[skill]).sort((a, b) => {
                    const oa = subcatOrder(skill, a), ob = subcatOrder(skill, b);
                    if (oa !== ob) return oa - ob;
                    return a.localeCompare(b, 'ru');
                });
                subcats.forEach(subcat => {
                    if (subcats.length > 1) {
                        html += `<div class="subcat-header">${escapeHtml(subcat)} · ${grouped[skill][subcat].length}</div>`;
                    }
                    html += `<div class="craft-list" data-skill="${escapeHtml(skill)}" data-subcat="${escapeHtml(subcat)}"></div>`;
                });
            });

            container.innerHTML = html;

            sortedSkills.forEach(skill => {
                const subcats = Object.keys(grouped[skill]);
                subcats.forEach(subcat => {
                    const listEl = container.querySelector(`.craft-list[data-skill="${CSS.escape(skill)}"][data-subcat="${CSS.escape(subcat)}"]`);
                    if (!listEl) return;
                    grouped[skill][subcat].forEach(item => listEl.appendChild(buildCraftRow(item)));
                });
            });
        }

        function buildCraftRow(item) {
            const row = document.createElement('div');
            row.className = 'craft-list-item';
            row.dataset.id = item.id;
            const profit = item.profit || 0;
            const profitClass = profit > 0 ? 'green' : (profit < 0 ? 'red' : '');
            const profitSign = profit > 0 ? '+' : '';
            const iconHtml = item.icon
                ? `<img class="craft-list-icon" src="${item.icon}" alt="" onerror="this.style.display='none'">`
                : `<div class="craft-list-icon" style="display:flex;align-items:center;justify-content:center;color:#444;">?</div>`;
            const levelBadge = item.skillLevel
                ? `<span class="skill-level-badge lvl-${item.skillLevel}">ур. ${item.skillLevel}</span>`
                : '';

            const skill = item.skill || "Сырье и материалы";
            const myLvl = getMyLevel(skill);
            let bonusBadge = '';
            if (myLvl && myLvl > (item.skillLevel || 0)) {
                const b = computeBonus(item.skillLevel || 0, myLvl);
                bonusBadge = `<span style="background:#1e3a1e; color:#4caf50; font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid #4caf50;">×${b.multiplier.toFixed(2)}</span>`;
            }

            const stations = item.stations || item.requiredStations || [];
            let stationsHtml = '';
            if (stations.length > 0) {
                const names = stations.map(s => (typeof s === 'string' ? s : s.name)).slice(0, 4);
                stationsHtml = `<div class="craft-list-stations">🏗️ ${names.map(n => `<span class="station-mini">${escapeHtml(n)}</span>`).join('')}</div>`;
            }

            row.innerHTML = `
                ${iconHtml}
                <div class="craft-list-info">
                    <div class="craft-list-name">${escapeHtml(item.name)}${levelBadge}${bonusBadge}</div>
                    <div style="font-size:12px;color:#888;">
                        ${Math.round(item.cost || 0).toLocaleString('ru-RU')} ₽ → ${(item.sell_price || 0).toLocaleString('ru-RU')} ₽
                    </div>
                    ${stationsHtml}
                </div>
                <div class="craft-list-profit ${profitClass}">
                    ${profitSign}${Math.round(profit).toLocaleString('ru-RU')} ₽
                    <div style="font-size:12px;font-weight:normal;color:#888;">ROI: ${(item.roi || 0).toFixed(1)}%</div>
                </div>
            `;
            return row;
        }

        function flattenTree(node, quantity, flat, excess, userLevels) {
            if (!node) return;
            flat = flat || new Map();
            excess = excess || new Map();
            const hasIngredients = node.ingredients && node.ingredients.length > 0;
            const isCraftable = node.craftable && hasIngredients;

            if (!isCraftable) {
                const id = node.id;
                if (!flat.has(id)) {
                    flat.set(id, {
                        id, name: node.name, icon: node.icon,
                        quantity: 0,
                        unit_price: node.sell_price || 0,
                        total_cost: 0
                    });
                }
                const item = flat.get(id);
                item.quantity += quantity;
                item.total_cost = item.quantity * item.unit_price;
                return;
            }

            const skill = node.skill || "Сырье и материалы";
            const requiredLevel = node.skillLevel || 1;
            const myLevel = (userLevels && userLevels[skill]) || requiredLevel;
            const bonus = computeBonus(requiredLevel, myLevel);

            const baseAmount = node.craftAmount || 1;
            const avgPerCraft = baseAmount * bonus.multiplier;

            const craftsNeeded = Math.ceil(quantity / avgPerCraft - 1e-9);
            const totalProduced = craftsNeeded * avgPerCraft;
            const excessQty = totalProduced - quantity;

            if (excessQty > 1e-9) {
                const id = node.id;
                if (!excess.has(id)) {
                    excess.set(id, {
                        id, name: node.name, icon: node.icon,
                        quantity: 0,
                        unit_price: node.sell_price || 0
                    });
                }
                const ex = excess.get(id);
                ex.quantity += excessQty;
                ex.total_value = ex.quantity * ex.unit_price;
            }

            for (const ing of node.ingredients) {
                flattenTree(ing, ing.amount * craftsNeeded, flat, excess, userLevels);
            }
        }

        function renderShoppingList(flat) {
            const items = Array.from(flat.values()).sort((a, b) => {
                const aHas = a.unit_price > 0;
                const bHas = b.unit_price > 0;
                if (aHas && !bHas) return -1;
                if (!aHas && bHas) return 1;
                return b.total_cost - a.total_cost;
            });
            if (items.length === 0) {
                return '<div class="empty-state" style="padding:20px;">Нет сырьевых материалов</div>';
            }
            let totalCost = 0;
            const rows = items.map(item => {
                const hasPrice = item.unit_price > 0;
                if (hasPrice) totalCost += item.total_cost;
                const priceText = hasPrice ? `${item.unit_price.toLocaleString('ru-RU')} ₽` : '<span class="no-price">—</span>';
                const costText = hasPrice ? `${Math.round(item.total_cost).toLocaleString('ru-RU')} ₽` : '—';
                const iconHtml = item.icon
                    ? `<img class="shopping-icon" src="${item.icon}" alt="" onerror="this.style.display='none'">`
                    : '';
                const qtyText = Number.isInteger(item.quantity)
                    ? item.quantity.toLocaleString('ru-RU')
                    : item.quantity.toFixed(2).replace('.', ',');
                return `<tr>
                    <td>${iconHtml}${escapeHtml(item.name)}</td>
                    <td style="text-align:right;font-weight:bold;">${qtyText}</td>
                    <td style="text-align:right;">${priceText}</td>
                    <td style="text-align:right;" class="price-cell">${costText}</td>
                </tr>`;
            }).join('');
            return `
                <table class="shopping-table">
                    <thead>
                        <tr>
                            <th>Материал</th>
                            <th style="text-align:right;">Кол-во</th>
                            <th style="text-align:right;">Цена за 1</th>
                            <th style="text-align:right;">Итого</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr style="background:#32324a;">
                            <td colspan="3" style="text-align:right;font-weight:bold;color:#aaa;">Всего материалов:</td>
                            <td style="text-align:right;font-weight:bold;color:#61dafb;font-size:16px;">${Math.round(totalCost).toLocaleString('ru-RU')} ₽</td>
                        </tr>
                    </tfoot>
                </table>
            `;
        }

        function renderExcess(excess) {
            const items = Array.from(excess.values()).sort((a, b) => b.quantity - a.quantity);
            if (items.length === 0) return '';
            const rows = items.map(item => {
                const iconHtml = item.icon
                    ? `<img class="shopping-icon" src="${item.icon}" alt="" onerror="this.style.display='none'">`
                    : '';
                const valueText = item.unit_price > 0
                    ? `<span style="color:#888;font-size:12px;">≈ ${Math.round(item.total_value).toLocaleString('ru-RU')} ₽</span>`
                    : '';
                const qtyText = Number.isInteger(item.quantity)
                    ? item.quantity.toLocaleString('ru-RU')
                    : item.quantity.toFixed(2).replace('.', ',');
                return `<tr>
                    <td>${iconHtml}${escapeHtml(item.name)}</td>
                    <td style="text-align:right;font-weight:bold;color:#ffc107;">${qtyText} шт</td>
                    <td style="text-align:right;">${valueText}</td>
                </tr>`;
            }).join('');
            return `
                <div class="excess-section">
                    <h3>📦 Останется после крафта (средний излишек)</h3>
                    <table class="shopping-table" style="margin-top:0;">
                        <thead>
                            <tr>
                                <th>Предмет</th>
                                <th style="text-align:right;">Останется</th>
                                <th style="text-align:right;">Оценочно</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <div class="excess-hint">Указано среднее значение с учётом вероятности бонусных крафтов.</div>

        function renderStations(craft) {
            const stations = craft.stations || [];
            const required = craft.requiredStations || [];
            let list = [];
            if (stations.length > 0 && typeof stations[0] === 'object') {
                list = stations;
            } else if (required.length > 0) {
                list = required.map(s => ({ id: s, name: s, craftable: false }));
            }
            if (list.length === 0) return '';
            const cards = list.map(s => {
                const craftable = s.craftable === true;
                const statusClass = craftable ? 'craft' : 'buy';
                const statusText = craftable ? 'Можно скрафтить' : 'Покупается / строится отдельно';
                return `
                    <div class="station-card ${craftable ? 'craftable' : ''}">
                        <div class="station-name">🏗️ ${escapeHtml(s.name || s.id)}</div>
                        <div class="station-status ${statusClass}">${statusText}</div>
                    </div>

            return `
                <h3 style="color:#61dafb; margin-top:20px;">🏗️ Что нужно построить</h3>
                <div class="stations-grid">${cards}</div>
            `;
        }

        function renderSummary(flat, craft, qty, bonusMultiplier) {
    // --- Глубокая себестоимость (крафт до сырья) ---
    let materialsCost = 0;
    let missingCount = 0;
    for (const item of flat.values()) {
        if (item.unit_price > 0) materialsCost += item.total_cost;
        else missingCount++;
    }
    const sellUnit = craft.sell_price || 0;
    const sellTotal = sellUnit * qty;
    const profit = sellTotal - materialsCost;
    const profitClass = profit > 0 ? 'green' : (profit < 0 ? 'red' : '');
    const profitSign = profit > 0 ? '+' : '';
    const roi = materialsCost > 0 ? (profit / materialsCost * 100) : 0;

    // --- 1 ступень (покупка прямых ингредиентов) ---
    const costDirect = craft.cost_direct || 0;
    const costDirectTotal = costDirect * qty;
    const profitDirect = sellTotal - costDirectTotal;
    const profitDirectClass = profitDirect > 0 ? 'green' : (profitDirect < 0 ? 'red' : '');
    const profitDirectSign = profitDirect > 0 ? '+' : '';
    const roiDirect = costDirectTotal > 0 ? (profitDirect / costDirectTotal * 100) : 0;

    // --- С бонусом от уровня ---
    const b = bonusMultiplier || 1;
    const costWithBonus = b > 0 ? (materialsCost / b) : materialsCost;
    const profitWithBonus = sellTotal - costWithBonus;
    const profitWithBonusClass = profitWithBonus > 0 ? 'green' : (profitWithBonus < 0 ? 'red' : '');
    const profitWithBonusSign = profitWithBonus > 0 ? '+' : '';
    const roiWithBonus = costWithBonus > 0 ? (profitWithBonus / costWithBonus * 100) : 0;

    let bonusRowHtml = '';
    if (b > 1) {
        bonusRowHtml = `
            <tr>
                <td>✨ С бонусом (×${b.toFixed(2)})</td>
                <td style="text-align:right;">${Math.round(costWithBonus).toLocaleString('ru-RU')} ₽</td>
                <td style="text-align:right;">${Math.round(sellTotal).toLocaleString('ru-RU')} ₽</td>
                <td style="text-align:right;" class="${profitWithBonusClass}">${profitWithBonusSign}${Math.round(profitWithBonus).toLocaleString('ru-RU')} ₽</td>
                <td style="text-align:right;" class="${profitWithBonusClass}">${roiWithBonus.toFixed(1)}%</td>
            </tr>
        `;
    }

    return `
        <div class="craft-summary-grid">
            <div class="craft-summary-item">
                <div class="craft-summary-value">${qty.toLocaleString('ru-RU')} шт</div>
                <div class="craft-summary-label">Хотим получить</div>
            </div>
            <div class="craft-summary-item">
                <div class="craft-summary-value">${Math.round(materialsCost).toLocaleString('ru-RU')} ₽</div>
                <div class="craft-summary-label">Материалы (через крафт)</div>
                ${missingCount > 0 ? `<div style="font-size:11px;color:#888;margin-top:2px;">${missingCount} без цены</div>` : ''}
            </div>
            <div class="craft-summary-item">
                <div class="craft-summary-value">${Math.round(sellTotal).toLocaleString('ru-RU')} ₽</div>
                <div class="craft-summary-label">Продажа</div>
                <div style="font-size:11px;color:#888;margin-top:2px;">${sellUnit.toLocaleString('ru-RU')} ₽/шт</div>
            </div>
            <div class="craft-summary-item">
                <div class="craft-summary-value ${profitClass}">${profitSign}${Math.round(profit).toLocaleString('ru-RU')} ₽</div>
                <div class="craft-summary-label">Прибыль (крафт)</div>
                <div style="font-size:11px;color:#888;margin-top:2px;">ROI: ${roi.toFixed(1)}%</div>
            </div>
        </div>

        <table class="shopping-table" style="margin-top:15px;">
            <thead>
                <tr>
                    <th>Вариант</th>
                    <th style="text-align:right;">Себестоимость</th>
                    <th style="text-align:right;">Продажа</th>
                    <th style="text-align:right;">Прибыль</th>
                    <th style="text-align:right;">ROI</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>🛒 Купить прямые ингредиенты (1 ступень)</td>
                    <td style="text-align:right;">${Math.round(costDirectTotal).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;">${Math.round(sellTotal).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;" class="${profitDirectClass}">${profitDirectSign}${Math.round(profitDirect).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;" class="${profitDirectClass}">${roiDirect.toFixed(1)}%</td>
                </tr>
                <tr>
                    <td>🔨 Скрафтить ингредиенты самостоятельно</td>
                    <td style="text-align:right;">${Math.round(materialsCost).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;">${Math.round(sellTotal).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;" class="${profitClass}">${profitSign}${Math.round(profit).toLocaleString('ru-RU')} ₽</td>
                    <td style="text-align:right;" class="${profitClass}">${roi.toFixed(1)}%</td>
                </tr>
                ${bonusRowHtml}
            </tbody>
        </table>
        <div style="font-size:12px;color:#888;margin-top:10px;">
            💡 <b>1 ступень</b> — покупаете прямые ингредиенты готовыми по рыночной цене, не тратя время на их крафт.<br>
            🔨 <b>Самостоятельный крафт</b> — считаем себестоимость через всю цепочку до сырья.<br>
            ✨ <b>С бонусом</b> — учитываем ваш уровень и повышенный выход.
        </div>
    `;
}

        function renderIngredientRow(ing, isSubCraft) {
            const iconHtml = ing.icon
                ? `<img class="craft-ingredient-icon" src="${ing.icon}" alt="" onerror="this.style.display='none'">`
                : `<div class="craft-ingredient-icon" style="display:flex;align-items:center;justify-content:center;color:#444;font-size:11px;">?</div>`;
            const subInfo = isSubCraft ? `<span style="color:#61dafb;font-size:11px;margin-left:6px;">(крафт)</span>` : '';
            const costText = ing.total_cost > 0
                ? `${Math.round(ing.total_cost).toLocaleString('ru-RU')} ₽`
                : '—';
            return `
                ${iconHtml}
                <span class="craft-ingredient-name">${escapeHtml(ing.name)}${subInfo}</span>
                <span class="craft-ingredient-amount">×${ing.amount.toLocaleString('ru-RU')}</span>
                <span class="craft-ingredient-cost">${costText}</span>
            `;
        }

        function renderTreeIngredients(ingredients, userLevels) {
            if (!ingredients || ingredients.length === 0) return '';
            let html = '<div class="craft-ingredients">';
            ingredients.forEach(ing => {
                const isCraft = ing.craftable && ing.ingredients && ing.ingredients.length > 0;
                if (isCraft) {
                    const extra = [];
                    if (ing.craftAmount && ing.craftAmount > 1) extra.push(`×${ing.craftAmount}`);
                    const skill = ing.skill || "Сырье и материалы";
                    const reqLevel = ing.skillLevel || 1;
                    const myLvl = userLevels[skill] || reqLevel;
                    if (myLvl > reqLevel) {
                        const b = computeBonus(reqLevel, myLvl);
                        extra.push(`✨ ×${b.multiplier.toFixed(2)}`);
                    }
                    if (ing.energy) extra.push(`⚡${ing.energy}`);
                    if (ing.skill) extra.push(`${ing.skill} ур.${ing.skillLevel}`);
                    if (ing.station) extra.push(`🛠 ${ing.station}`);
                    html += `
                        <details class="craft-sub">
                            <summary>${renderIngredientRow(ing, true)}</summary>
                            <div class="craft-sub-body">
                                ${extra.length ? `<div style="font-size:12px;color:#888;margin-bottom:6px;">${extra.join(' · ')}</div>` : ''}
                                ${renderTreeIngredients(ing.ingredients, userLevels)}
                            </div>
                        </details>
                    `;
                } else {
                    html += `<div class="craft-ingredient">${renderIngredientRow(ing, false)}</div>`;
                }
            });
            html += '</div>';
            return html;
        }

        function renderTreeRoot(node, userLevels) {
            if (!node) return '';
            const profit = node.profit || 0;
            const nodeClass = profit > 0 ? 'profitable' : (profit < 0 ? 'unprofitable' : '');
            const iconHtml = node.icon
                ? `<img class="craft-node-icon" src="${node.icon}" alt="" onerror="this.style.display='none'">`
                : `<div class="craft-node-icon" style="display:flex;align-items:center;justify-content:center;color:#444;">?</div>`;
            const parts = [];
            if (node.craftAmount && node.craftAmount > 1) parts.push(`×${node.craftAmount} за крафт`);
            if (node.energy) parts.push(`⚡ ${node.energy} эн.`);
            if (node.skill) parts.push(`🎓 ${node.skill} ур. ${node.skillLevel}`);
            if (node.experience) parts.push(`⭐ ${node.experience} XP`);
            const extraInfo = parts.length ? `<div style="font-size:12px;color:#888;margin-top:6px;">${parts.join(' · ')}</div>` : '';

            return `
                <div class="craft-node ${nodeClass}">
                    <div class="craft-node-header">
                        ${iconHtml}
                        <div>
                            <div class="craft-node-name">${escapeHtml(node.name)}</div>
                            <div class="craft-node-id">ID: ${node.id}</div>
                            ${extraInfo}
                        </div>
                    </div>
                    ${renderTreeIngredients(node.ingredients, userLevels)}
                </div>
            `;
        }

        function renderBonusBanner(craft, myLevel) {
            const skill = craft.skill || "Сырье и материалы";
            const reqLevel = craft.skillLevel || 1;
            const baseAmount = craft.craftAmount || 1;

            if (myLevel <= reqLevel) {
                const extra = myLevel < reqLevel ? " (у вас ниже требуемого — бонус не применяется)" : " (уровень совпадает с требуемым)";
                return `
                    <div class="bonus-banner" style="border-left-color:#888;">
                        <div class="bonus-banner-title">🎓 Требуется уровень <b>${reqLevel}</b> навыка «${escapeHtml(skill)}»${extra}</div>
                        <div class="bonus-banner-hint">Базовый выход: <b>${baseAmount}</b> шт за крафт. Бонус за превосходство не применяется.</div>
                        <div class="bonus-input-row">
                            <label>Ваш уровень «${escapeHtml(skill)}»:</label>
                            <select class="my-level-input" data-skill="${escapeHtml(skill)}">
                                ${[1,2,3,4,5].map(lvl => `<option value="${lvl}" ${lvl === myLevel ? 'selected' : ''}>${lvl}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
            }

            const b = computeBonus(reqLevel, myLevel);
            const avgPerCraft = baseAmount * b.multiplier;
            const guaranteedText = b.guaranteed > 0 ? `${b.guaranteed} гарантированно` : '';
            const fracText = b.fractional > 0 ? `${Math.round(b.fractional*100)}% на ещё один` : '';
            const combined = [guaranteedText, fracText].filter(Boolean).join(' + ') || '—';

            return `
                <div class="bonus-banner">
                    <div class="bonus-banner-title">
                        🎓 Ваш уровень <b>${myLevel}</b>, рецепт требует <b>${reqLevel}</b>.
                        Превосходство: <b>+${b.bonusLevels}</b> уровн${b.bonusLevels === 1 ? 'ь' : 'я'} → шанс <b>${b.chance}%</b>.
                    </div>
                    <div class="bonus-banner-hint">
                        Бонусные крафты: ${combined}<br>
                        Множитель за крафт: <span class="bonus-banner-value">×${b.multiplier.toFixed(2)}</span><br>
                        Средний выход: <b>${baseAmount}</b> × ${b.multiplier.toFixed(2)} = <span class="bonus-banner-value">${avgPerCraft % 1 === 0 ? avgPerCraft : avgPerCraft.toFixed(2)} шт</span> за крафт
                    </div>
                    <div class="bonus-input-row">
                        <label>Ваш уровень «${escapeHtml(skill)}»:</label>
                        <select class="my-level-input" data-skill="${escapeHtml(skill)}">
                            ${[1,2,3,4,5].map(lvl => `<option value="${lvl}" ${lvl === myLevel ? 'selected' : ''}>${lvl}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
        }

        function openCraftModal(id) {
            const craft = craftsData[id];
            if (!craft) return;
            let quantity = 1;

            const skill = craft.skill || "Сырье и материалы";
            const reqLevel = craft.skillLevel || 1;
            const savedMyLevel = getMyLevel(skill) || reqLevel;
            const userLevels = {};
            userLevels[skill] = savedMyLevel;

            const qtyRowHtml = `
                <div class="qty-row">
                    <label for="craftQtyInput">Сколько крафтить (штук):</label>
                    <input type="number" id="craftQtyInput" class="qty-input" value="1" min="1" max="99999">
                    <button class="qty-preset" data-qty="1">1</button>
                    <button class="qty-preset" data-qty="5">5</button>
                    <button class="qty-preset" data-qty="10">10</button>
                    <button class="qty-preset" data-qty="50">50</button>
                    <button class="qty-preset" data-qty="100">100</button>
                </div>
            `;

            els.craftModalContent.innerHTML = `
                <h2 style="color:#61dafb; margin-top:0;">🔨 Калькулятор крафта</h2>
                <div style="font-size:18px;color:#e0e0e0;margin-bottom:15px;">${escapeHtml(craft.name)}</div>

                ${qtyRowHtml}
                <div class="craft-summary" id="craftSummaryBox"></div>
                <div id="craftExcessBox"></div>
                <h3 style="color:#61dafb; margin-top:0;">🛒 Список покупок</h3>
                <div id="craftShoppingBox"></div>
                <div id="craftStationsBox"></div>
                <h3 style="color:#61dafb; margin-top:25px;">🌳 Дерево крафта</h3>
                <div style="font-size:12px;color:#888;margin-bottom:10px;">Нажмите «+» на подкрафтах, чтобы раскрыть их содержимое.</div>

            `;

            document.getElementById('craftStationsBox').innerHTML = renderStations(craft);

            function renderBonus() {
                document.getElementById('craftBonusBox').innerHTML = renderBonusBanner(craft, userLevels[skill]);
                document.querySelectorAll('.my-level-input').forEach(sel => {
                    sel.addEventListener('change', (e) => {
                        const newLvl = parseInt(e.target.value) || 1;
                        userLevels[skill] = newLvl;
                        setMyLevel(skill, newLvl);
                        refresh();
                        renderBonus();
                    });
                });
            }

            function refresh() {
                const flat = new Map();
                const excess = new Map();
                flattenTree(craft, quantity, flat, excess, userLevels);
                const bonusMult = userLevels[skill] > reqLevel
    ? computeBonus(reqLevel, userLevels[skill]).multiplier
    : 1;
document.getElementById('craftSummaryBox').innerHTML = renderSummary(flat, craft, quantity, bonusMult);
                document.getElementById('craftExcessBox').innerHTML = renderExcess(excess);
                document.getElementById('craftShoppingBox').innerHTML = renderShoppingList(flat);
                document.getElementById('craftTreeBox').innerHTML = renderTreeRoot(craft, userLevels);
            }

            renderBonus();
            refresh();

            const qtyInput = document.getElementById('craftQtyInput');
            qtyInput.addEventListener('input', () => {
                quantity = Math.max(1, parseInt(qtyInput.value) || 1);
                refresh();
            });
            document.querySelectorAll('.qty-preset').forEach(btn => {
                btn.addEventListener('click', () => {
                    quantity = parseInt(btn.dataset.qty) || 1;
                    qtyInput.value = quantity;
                    refresh();
                });
            });

            els.craftModalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeCraftModal() {
            els.craftModalOverlay.style.display = 'none';
            document.body.style.overflow = '';
        }

        let observer = null;
        function setupInfiniteScroll() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && currentChunk * CHUNK_SIZE < filteredItems.length) {
                    renderNextChunk();
                }
            }, { rootMargin: '300px' });
            observer.observe(els.sentinel);
        }

        els.categorySelect.addEventListener('change', applyFilters);
        els.sortSelect.addEventListener('change', applyFilters);
        els.refreshBtn.addEventListener('click', loadData);

        let searchTimer = null;
        els.searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applyFilters, 200);
        });

        els.itemsGrid.addEventListener('click', (e) => {
            const star = e.target.closest('[data-star]');
            if (star) {
                e.stopPropagation();
                const id = star.dataset.star;
                const nowFav = toggleFavorite(id);
                star.classList.toggle('active', nowFav);
                star.title = nowFav ? 'Убрать из избранного' : 'В избранное';
                const favOpt = els.categorySelect.querySelector(`option[value="${FAVORITES_KEY}"]`);
                if (favOpt) favOpt.textContent = `⭐ Избранное (${favorites.length})`;
                if (els.categorySelect.value === FAVORITES_KEY) applyFilters();
                return;
            }
            const card = e.target.closest('.item-card');
            if (card) openModal(card.dataset.id);
        });

        els.modalClose.addEventListener('click', closeModal);
        els.modalOverlay.addEventListener('click', (e) => { if (e.target === els.modalOverlay) closeModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (els.modalOverlay.style.display !== 'none') closeModal();
                if (els.craftModalOverlay.style.display !== 'none') closeCraftModal();
            }
        });

        els.craftSkillSelect.addEventListener('change', renderCraftList);
        els.craftLevelSelect.addEventListener('change', renderCraftList);
        els.craftSortSelect.addEventListener('change', renderCraftList);
        let craftSearchTimer = null;
        els.craftSearchInput.addEventListener('input', () => {
            clearTimeout(craftSearchTimer);
            craftSearchTimer = setTimeout(renderCraftList, 200);
        });

        els.craftListContainer.addEventListener('click', (e) => {
            const row = e.target.closest('.craft-list-item');
            if (row) openCraftModal(row.dataset.id);
        });

        els.craftModalClose.addEventListener('click', closeCraftModal);
        els.craftModalOverlay.addEventListener('click', (e) => { if (e.target === els.craftModalOverlay) closeCraftModal(); });

        favorites = loadFavorites();
        setupInfiniteScroll();
        loadData();
    </script>
</body>
</html>
