name: Update Auction Data

on:
  schedule:
    # 06:00–08:40 MSK, one part per run. A missed slot is picked up by the next one.
    - cron: '0 3 * * *'
    - cron: '20 3 * * *'
    - cron: '40 3 * * *'
    - cron: '0 4 * * *'
    - cron: '20 4 * * *'
    - cron: '40 4 * * *'
    - cron: '0 5 * * *'
    - cron: '20 5 * * *'
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      item:
        description: Item id to refresh now
        type: string
        default: ''
      catalog:
        description: Refresh the item catalog
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.item != '' && 'stalzone-item' || 'stalzone-daily' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Clone item database
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.item == ''
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/EXBO-Studio/stalzone-database.git itemdb
          git -C itemdb sparse-checkout set ru/items

      - name: Refresh one item
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.item != ''
        timeout-minutes: 8
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
          ONLY_ITEM: ${{ github.event.inputs.item }}
        run: python fetch_prices.py

      - name: Scan the next morning part
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.item == ''
        timeout-minutes: 25
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
          PARTS: '8'
          NEXT_PART: '1'
        run: python fetch_prices.py

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prices.json crafts.json active_items.json sales_history.json sale_clock.json items.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.item }}" ]; then
            git commit -m "Refresh ${{ github.event.inputs.item }}"
          else
            git commit -m "Auto-update prices, crafts & sales"
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --onto origin/main HEAD~1 HEAD && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push rejected, retry ${attempt}"
            sleep 5
          done
          exit 1
