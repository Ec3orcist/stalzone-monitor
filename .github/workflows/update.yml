name: Update Auction Data

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      catalog:
        description: Refresh the item catalog
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'fetch_prices.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: stalzone-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Mark start
        run: date -u +%s > "$RUNNER_TEMP/started"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Decide whether to fetch
        id: gate
        env:
          CATALOG: ${{ github.event.inputs.catalog == 'true' || github.event.schedule == '17 3 * * *' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - << 'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          catalog = os.environ.get("CATALOG") == "true"
          event = os.environ.get("EVENT_NAME") or ""
          run = True
          path = Path("prices.json")
          if event != "schedule":
              print(f"Keep the chain going ({event or 'push'})")
          elif catalog:
              print("Catalog refresh")
          elif not path.exists():
              print("No prices yet")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              best = ""
              if isinstance(data, dict):
                  for rows in data.values():
                      if isinstance(rows, list) and rows and isinstance(rows[-1], dict):
                          stamp = str(rows[-1].get("timestamp") or "")
                          if stamp > best:
                              best = stamp
              if best:
                  ts = datetime.fromisoformat(best.replace("Z", "+00:00"))
                  if ts.tzinfo is None:
                      ts = ts.replace(tzinfo=timezone.utc)
                  age = (datetime.now(timezone.utc) - ts).total_seconds()
                  if age < 20 * 60:
                      run = False
                      print(f"Prices are {int(age)}s old, scheduled pass is not needed")
                  else:
                      print(f"Prices are {int(age)}s old, fetch")
              else:
                  print("No price stamp, fetch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'yes' if run else 'no'}\n")
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install requests

      - name: Clone item database
        if: steps.gate.outputs.run == 'yes' && (github.event.inputs.catalog == 'true' || github.event.schedule == '17 3 * * *')
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/EXBO-Studio/stalzone-database.git itemdb
          git -C itemdb sparse-checkout set ru/items

      - name: Fetch data
        id: fetch
        if: steps.gate.outputs.run == 'yes'
        timeout-minutes: 16
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
        run: python fetch_prices.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'yes' && steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prices.json crafts.json active_items.json sales_history.json sale_clock.json items.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "Auto-update prices, crafts & sales"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --onto origin/main HEAD~1 HEAD && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push rejected, retry ${attempt}"
            sleep 5
          done
          exit 1

      - name: Queue next update
        if: always() && steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start=$(cat "$RUNNER_TEMP/started")
          now=$(date -u +%s)
          wait=$((start + 900 - now))
          if [ "$wait" -gt 0 ]; then
            echo "Wait ${wait}s so the next pass stays on a 15 minute pace"
            sleep "$wait"
          fi
          for attempt in 1 2 3; do
            if curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/dispatches" \
              -d '{"ref":"main","inputs":{"catalog":"false"}}'; then
              echo "Next pass queued"
              exit 0
            fi
            echo "Dispatch failed, retry ${attempt}"
            sleep 5
          done
          exit 1
