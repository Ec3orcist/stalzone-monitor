name: Update Auction Data

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      item:
        description: Item id to refresh now
        type: string
        default: ''
      catalog:
        description: Refresh the item catalog
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: stalzone-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Clone item database
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.item == ''
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/EXBO-Studio/stalzone-database.git itemdb
          git -C itemdb sparse-checkout set ru/items

      - name: Refresh one item
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.item != ''
        timeout-minutes: 8
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
          ONLY_ITEM: ${{ github.event.inputs.item }}
        run: python fetch_prices.py

      - name: Scan the daily parts
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.item == ''
        timeout-minutes: 140
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
          PARTS: '8'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_prices() {
            git add -- prices.json crafts.json active_items.json sales_history.json sale_clock.json items.json
            if git diff --cached --quiet; then
              echo "No price changes"
              return 0
            fi
            git commit -m "Auto-update prices, crafts & sales"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase --onto origin/main HEAD~1 HEAD && git push origin HEAD:main; then
                return 0
              fi
              git rebase --abort || true
              echo "Push rejected, retry ${attempt}"
              sleep 5
            done
            return 1
          }
          for part in 0 1 2 3 4 5 6 7; do
            echo "Part $((part + 1))/8"
            ok=0
            for attempt in 1 2 3; do
              if PART="$part" python fetch_prices.py; then
                ok=1
                break
              fi
              echo "Part $part failed, retry ${attempt}"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then
              exit 1
            fi
            commit_prices || exit 1
          done

      - name: Commit one item
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.item != '' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prices.json crafts.json active_items.json sales_history.json sale_clock.json items.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "Refresh ${{ github.event.inputs.item }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --onto origin/main HEAD~1 HEAD && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push rejected, retry ${attempt}"
            sleep 5
          done
          exit 1
