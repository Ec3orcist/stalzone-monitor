name: Update Auction Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      parse_recipes:
        description: 'Парсить рецепты с StalzoneHQ (долго, ~15 мин)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests
          pip install cloudscraper

      - name: Clone item database
        run: git clone --depth 1 https://github.com/EXBO-Studio/stalzone-database.git itemdb

      - name: Parse recipes (только при ручном запуске)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.parse_recipes == 'true'
        env:
          REGION: EU
        run: python parse_recipes.py

      - name: Fetch data
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
        run: python fetch_prices.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update auction prices"
          file_pattern: "prices.json crafts.json recipes.json"
