name: Update Auction Data

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: stalzone-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Clone item database
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/EXBO-Studio/stalzone-database.git itemdb
          git -C itemdb sparse-checkout set ru/items

      - name: Fetch data
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REGION: EU
        run: python fetch_prices.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update prices, crafts & sales"
          file_pattern: "prices.json crafts.json active_items.json sales_history.json sale_clock.json items.json"
